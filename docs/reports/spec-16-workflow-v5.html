<!doctype html>
<!--
spec 汇报模板（workflow-v5 候选）：单文件，浏览器直接打开，可断网使用。用法和每节的数据见同目录 report.md。
只替换文件末尾 data-slot="data" 的 JSON：{"report": 设计负责人填写的部分, "scorecard": tickets.ts scorecard --out 的原样输出}。
节次按六点：做了什么和效果、目标与证明、要你做的、证据、代价与时间、风险与遗留；流程发现和数据口径折叠在最后。
时间线、时间去向、验证卡片和用量都只读 scorecard；缺数显示"未记录"和 reason，不按零画。超过 45 分钟的空档压成竖纹。
图按容器宽度绘制，窗口变宽变窄时重画；配色是 dataviz 默认色板的浅色、深色两套，状态色只用于状态。
脚本在一个块作用域里，不新增全局名字。示例数据是 video-studio spec #94（评分表由 agent-workflow #9 重建）。
-->

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spec 汇报</title>
<style>
:root {

  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10); --wash: rgba(11,11,11,.04);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --goodtext: #006300;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --goodtext: #0ca30c;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 64px; }
header { margin-bottom: 8px; }
h1 { font-size: 24px; line-height: 1.3; margin: 4px 0 8px; }
h2 { font-size: 18px; margin: 0 0 12px; }
h3 { font-size: 15px; margin: 0 0 6px; }
p { margin: 0 0 8px; }
a { color: var(--s1); }
.meta, .muted { color: var(--muted); font-size: 13px; }
.lead { font-size: 16px; color: var(--ink2); }
section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin: 14px 0; }
.banner { display: block; margin: 12px 0 4px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--serious); color: var(--ink); text-decoration: none; background: var(--wash); }
.banner b { color: var(--ink); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.tile .v { font-size: 24px; font-weight: 600; line-height: 1.2; }
.tile .k { color: var(--ink2); font-size: 13px; }
.tile .n { color: var(--muted); font-size: 12px; }
ul.plain, ol.plain { margin: 0; padding-left: 20px; }
ul.plain li, ol.plain li { margin: 4px 0; }
.card { border-top: 1px solid var(--grid); padding: 12px 0; }
.card:first-child { border-top: 0; padding-top: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.status { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.status i { font-style: normal; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; color: #fff; font-size: 11px; }
.st-good i { background: var(--good); } .st-warning i { background: var(--warning); color: #0b0b0b; }
.st-serious i { background: var(--serious); } .st-critical i { background: var(--critical); } .st-info i { background: var(--muted); }
pre { margin: 6px 0 0; padding: 8px 10px; background: var(--wash); border-radius: 6px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-all; max-height: 220px; overflow: auto; }
img.thumb { max-width: 100%; max-height: 220px; border: 1px solid var(--border); border-radius: 6px; display: block; margin-top: 6px; }
.ev { margin-top: 6px; font-size: 13px; color: var(--ink2); }
.ev .num { font-size: 18px; color: var(--ink); font-weight: 600; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--ink2); font-size: 12px; font-family: inherit; }
svg .axis { stroke: var(--axis); stroke-width: 1; }
svg .gridl { stroke: var(--grid); stroke-width: 1; }
svg .lane { fill: var(--wash); }
.chart { margin: 10px 0 18px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink2); margin: 6px 0; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; background: var(--c); vertical-align: -1px; }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--ink2); font-size: 14px; }
.tw { overflow-x: auto; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--muted); font-weight: 500; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); max-width: 280px; white-space: pre-line; }
.empty { color: var(--muted); font-size: 14px; }
.dispatch-chart { margin: 10px 0 18px; }
.dispatch-item { padding: 10px 0; border-top: 1px solid var(--grid); min-width: 0; }
.dispatch-item:first-child { border-top: 0; }
.dispatch-heading { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; margin-bottom: 5px; }
.dispatch-heading b { overflow-wrap: anywhere; }
.dispatch-line { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 310px); gap: 12px; align-items: center; }
.dispatch-track { height: 10px; background: var(--wash); border-radius: 3px; overflow: hidden; }
.dispatch-fill { height: 100%; background: var(--dispatch-color); border-radius: 3px; }
.dispatch-unknown { background: transparent; border: 1px dashed var(--axis); }
.dispatch-meta { font-size: 12px; color: var(--ink2); overflow-wrap: anywhere; }
.dispatch-reason { font-size: 12px; color: var(--ink2); margin-top: 4px; overflow-wrap: anywhere; }
.dispatch-exit { color: var(--critical); font-weight: 600; }
footer { color: var(--muted); font-size: 12px; margin-top: 18px; }
@media (max-width: 640px) {
  main { padding: 16px 12px 48px; }
  section { padding: 14px 12px; }
  .row { grid-template-columns: 1fr; }
  .dispatch-line { grid-template-columns: minmax(0, 1fr); gap: 5px; }
  h1 { font-size: 20px; }
}
</style>
</head>
<body>
<main>
  <header>
    <p class="meta" data-slot="meta"></p>
    <h1 data-slot="title"></h1>
    <p class="lead" data-slot="result"></p>
    <a class="banner" href="#asks" data-slot="banner" hidden></a>
  </header>

  <section id="done">
    <h2>1. 做了什么，效果如何</h2>
    <div class="tiles" data-slot="done-tiles"></div>
    <div data-slot="delivered"></div>
  </section>

  <section id="goals">
    <h2>2. 目标与证明</h2>
    <p class="muted">按 spec 问题陈述里的现状，用同一口径重测。灰点是改前，蓝点是改后，竖线是目标。</p>
    <div data-slot="goals"></div>
  </section>

  <section id="asks">
    <h2>3. 要你做的</h2>
    <div data-slot="asks"></div>
  </section>

  <section id="evidence">
    <h2>4. 证据</h2>
    <p class="muted">可以抽查的实测值、命令输出和截图，链接只作补充。</p>
    <div data-slot="evidence"></div>
  </section>

  <section id="cost">
    <h2>5. 代价与时间</h2>
    <h3>时间线</h3>
    <p class="muted">按资源分泳道；超过 45 分钟没有活动的空档压缩成一道竖纹。</p>
    <div class="legend" data-slot="lane-legend"></div>
    <div class="chart" data-slot="timeline"></div>
    <h3>时间去向</h3>
    <div class="chart" data-slot="time-bars"></div>
    <h3>验证与合并</h3>
    <div class="tiles" data-slot="verify-tiles"></div>
    <h3>用量</h3>
    <p class="muted">输入含缓存读取；条长是输入 token。</p>
    <div class="chart" data-slot="usage-bars"></div>
    <p class="muted" data-slot="usage-note"></p>
    <h3>逐次派发</h3>
    <p class="muted">每条是一次派发，条长按分钟使用同一刻度，颜色沿用 Codex 泳道。未知时不画时长，显示原因；悬停或聚焦可查看完整字段。</p>
    <div class="dispatch-chart" data-slot="dispatch-bars" role="group" aria-label="逐次派发的分钟与用量"></div>
    <details><summary>派发表格（查找）</summary><div data-slot="dispatch-table"></div></details>
    <details><summary>验证明细</summary><div data-slot="verify-table"></div></details>
  </section>

  <section id="risks">
    <h2>6. 风险与遗留</h2>
    <div data-slot="risks"></div>
  </section>

  <details>
    <summary>流程发现与数据口径</summary>
    <div data-slot="findings"></div>
    <div data-slot="notes"></div>
  </details>

  <footer data-slot="footer"></footer>
</main>
<div class="tip" data-slot="tip" hidden></div>

  put("verify-tiles", 
    tile(ver ? `${ver.fullCount} 次` : "未记录", "完整验证", ver ? `共 ${fmtMin(ver.fullMinutes)}` : why(S && S.verification)),
    tile(ver ? `${ver.staticCount} 次` : "未记录", "静态检查"),
    tile(merges ? `${merges.landCount} 次` : "未记录", "合并（land）", merges ? `完整验证失败 ${merges.fullVerificationFailures} 次` : null),
    tile(failureSum === null ? "未知" : `${failureSum} 次`, "流程故障", "派发无汇报、land 停下、验证启动失败"),
    tile(val(S && S.userInterventions) === null || !S ? "未知" : `${val(S.userInterventions)} 次`, "用户介入"),
    tile(median === null ? "未知" : fmtMin(median), "开工开销（中位）", "派发到第一次改文件"),
  );
  if (S) {
    const n = val(S.usage.subagentNotifications);
    put("usage-note", n === null ? `任务通知里的子代理 token：未记录（${why(S.usage.subagentNotifications)}）。` : `任务通知报的子代理 token 合计 ${fmtTok(n)}，可和上面子代理一行互相核对。`);
  }

  const USAGE = [["codexDispatch", "Codex 派发"], ["codexReview", "Codex 审查"], ["mainSession", "主会话"], ["independentReview", "独立审查"], ["subagents", "子代理"]];
  const drawCharts = () => {
    drawGoals();
    for (const slot of ["timeline", "time-bars", "usage-bars"]) $(slot).replaceChildren();
    put("timeline", timeline());
    const bw = Math.max(300, $("time-bars").clientWidth);
    put("time-bars", S ? hbars(LANES.map(([key, name, color]) => ({ label: name, color, value: (val(S.time[key]) || {}).minutes ?? null, reason: why(S.time[key]) })), fmtMin, "各类时间的分钟数", bw) : el("p", { class: "empty", text: "没有评分表数据。" }));
    put("usage-bars", S ? hbars(USAGE.map(([key, label]) => {
      const u = val(S.usage[key]);
      return { label, value: u ? u.inputTokens : null, reason: why(S.usage[key]), short: u ? `输入 ${fmtTok(u.inputTokens)}` : null,
        text: u ? `输入 ${fmtTok(u.inputTokens)}（缓存 ${Math.round((100 * u.cachedInputTokens) / (u.inputTokens || 1))}%）· 输出 ${fmtTok(u.outputTokens)}` : null };
    }), fmtTok, "各来源的输入 token", bw) : el("p", { class: "empty", text: "没有评分表数据。" }));
  };
  drawCharts();
  const resize = { timer: 0, width: innerWidth };
  addEventListener("resize", () => {
    if (innerWidth === resize.width) return;
    resize.width = innerWidth;
    clearTimeout(resize.timer);
    resize.timer = setTimeout(drawCharts, 150);
  });

  const table = (head, rows) => el("div", { class: "tw" }, el("table", {}, el("thead", {}, el("tr", {}, head.map(([t, num]) => el("th", { class: num ? "num" : null, text: t })))),
    el("tbody", {}, rows.map((r) => el("tr", {}, r.map((c, i) => el("td", { class: head[i][1] ? "num" : null }, c)))))));
  put("dispatch-table", dispatches.length ? table([["记录"], ["工单"], ["类别"], ["开始"], ["分钟", 1], ["退出码", 1], ["输入", 1], ["输出", 1]],
    dispatches.map((d) => { const u = val(d.usage); return [d.record || "", d.ticket ? issue(d.ticket) : "", val(d.category) ?? "未知", fmtTime(val(d.start)), fmtNum(val(d.minutes), 1), String(val(d.exitCode) ?? "未知"), fmtTok(u && u.inputTokens), fmtTok(u && u.outputTokens)]; }))
    : el("p", { class: "empty", text: "无" }));
  const runs = (ver && ver.runs) || [];
  put("verify-table", runs.length ? table([["层"], ["对象"], ["调用方"], ["开始"], ["排队", 1], ["运行", 1], ["退出码", 1]],
    runs.map((r) => [r.layer === "full" ? "完整" : "静态", r.target.kind === "main" ? "主工作区" : `${r.target.kind === "pr" ? "PR" : "工单"} #${r.target.number}`, r.caller, fmtTime(r.start), fmtNum(r.queuedMinutes, 1), fmtNum(r.minutes, 1), String(r.exitCode)]))
    : el("p", { class: "empty", text: "无" }));

  const risks = R.risks || [];
  const LEVEL = { critical: "高", serious: "中", warning: "低", good: "已处理" };
  put("risks", risks.length ? risks.map((r) => el("div", { class: "card" },
    el("h3", {}, status(r.level || "warning", LEVEL[r.level] || ""), " ", r.what),
    r.impact ? el("div", { text: `影响：${r.impact}` }) : null,
    r.next ? el("div", { class: "muted", text: `去向：${r.next}` }) : null))
    : el("p", { class: "empty", text: "无" }));

  put("findings", el("h3", { text: "流程发现" }), (R.findings || []).length ? el("ul", { class: "plain" }, R.findings.map((f) => el("li", { text: f }))) : el("p", { class: "empty", text: "无" }));
  const notes = [...(R.notes || []).map((n) => [n.item, n.note]), ...((S && S.missing) || []).map((m) => [`评分表缺数：${m.field}`, m.reason])];
  put("notes", el("h3", { text: "数据口径与缺项" }), notes.length ? table([["项"], ["说明"]], notes) : el("p", { class: "empty", text: "无" }));
  $("footer").textContent = S ? `过程数据来自评分表（tickets.ts scorecard ${R.spec}），截点 ${fmtTime(S.cutoffAt)}，采集 ${fmtTime(S.collectedAt)}。目标、证据、决定和风险由设计负责人填写。` : "没有评分表数据。";
}
</script>
</body>
</html>
