.wf-axis-track { position: relative; height: 14px; background: var(--wash); border-radius: 999px; overflow: hidden; }
.wf-bar { position: absolute; top: 2px; height: 10px; border-radius: 999px; min-width: 6px; }
.wf-bar.aborted { background: none !important; border: 1.6px dashed var(--critical); }
.batch-fold { border: 1px solid var(--agy); border-radius: 10px; background: var(--surface2); padding: 9px 12px; min-width: 0; }

.risk-grid { display: grid; gap: 9px; }
.risk-card { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2); display: grid; gap: 4px; overflow-wrap: anywhere; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
.badge.good { background: var(--good-bg); color: var(--good); }
.badge.warn { background: var(--warning-bg); color: var(--warning); }
.badge.crit { background: var(--critical-bg); color: var(--critical); }
.badge.info { background: var(--info-bg); color: var(--agy); }
.fold-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; min-width: 0; overflow: hidden; }
.fold-box > summary { cursor: pointer; font-weight: 700; font-size: 13.5px; color: var(--ink); }

.floating-tip[hidden] { display: none !important; }
.lightbox {

footer { color: var(--muted); font-size: 12px; padding: 4px 2px; overflow-wrap: anywhere; }

  const ACTORS = buildActors();
  const findActorForDispatch = (d) => {
    const seat = d.seat || (d.ticket ? "engineering" : "review");
    const fw = d.framework || d.agent || "codex";
    const model = d.actualModel || d.model || "默认模型";
    const found = ACTORS.find((a) => a.seat === seat && a.fw === fw && a.model === model) || ACTORS.find((a) => a.seat === seat && a.fw === fw);
    return found ? found.id : "";
  };

  const cockpitTotals = val(S && S.cockpit && S.cockpit.totals);
  const sumKnown = (arr, key) => {
    const nums = arr.map((x) => x[key]).filter((v) => typeof v === "number");
    return nums.length ? nums.reduce((a, b) => a + b, 0) : null;
  };
  const totalFresh = cockpitTotals && typeof val(cockpitTotals.freshInput) === "number" ? val(cockpitTotals.freshInput) : sumKnown(ACTORS, "fresh");
  const totalOut = cockpitTotals && typeof val(cockpitTotals.output) === "number" ? val(cockpitTotals.output) : sumKnown(ACTORS, "output");
  const totalCached = cockpitTotals && typeof val(cockpitTotals.cachedReplay) === "number" ? val(cockpitTotals.cachedReplay) : sumKnown(ACTORS, "cached");
  const totalTurns = cockpitTotals && typeof val(cockpitTotals.turns) === "number" ? val(cockpitTotals.turns) : sumKnown(ACTORS, "turns");
  const totalRealTok = totalFresh !== null || totalOut !== null ? (totalFresh || 0) + (totalOut || 0) : null;

  const dLeadMin = (val(S && S.time && S.time.designLead) || {}).minutes ?? 0;
  const dispSlotMin = (val(S && S.time && (S.time.dispatchSlots || S.time.codexSlots)) || {}).minutes ?? 0;
  const verSlotMin = ((val(S && S.time && S.time.verification) || {}).minutes ?? 0) + ((val(S && S.time && S.time.queue) || {}).minutes ?? 0);
  const waitUserMin = (val(S && S.time && S.time.waitingUser) || {}).minutes ?? 0;
  const longPauseObj = val(S && S.time && S.time.longPause) || null;
  const longPauseMin = longPauseObj && typeof longPauseObj.minutes === "number" ? longPauseObj.minutes : 0;

  const collectAllSpans = () => {
    const lanes = [];
    const dSpans = ((val(S && S.time && S.time.designLead) || {}).spans || []).map((s) => ({
      a: Date.parse(s.start), b: Date.parse(s.end), kind: "ok", desc: "主会话统筹、定稿与验收"
    })).filter((s) => Number.isFinite(s.a) && Number.isFinite(s.b));
    const designActor = ACTORS.find((a) => a.seat === "director" || a.seat === "design" || a.seat === "main");
    if (dSpans.length) {
      lanes.push({
        actorId: designActor ? designActor.id : "",
        label: designActor ? `设计 · ${fwInfo(designActor.fw).label} (${designActor.effort})` : "设计负责人",
        color: "var(--design)",
        spans: dSpans
      });
    }
    const byLane = new Map();
    for (const d of dispatches) {
      const st = Date.parse(val(d.start) || "");
      const en = Date.parse(val(d.end) || "");
      if (!Number.isFinite(st) || !Number.isFinite(en)) continue;
      const fw = d.framework || d.agent || "codex";
      const seat = d.seat || (d.ticket ? "engineering" : "review");
      const key = `${seat}:${fw}`;
      if (!byLane.has(key)) {
        byLane.set(key, {
          actorId: findActorForDispatch(d),
          label: `${SEAT_LABEL[seat] || seat} · ${fwInfo(fw).label}`,
          color: fwInfo(fw).solid,
          spans: []
        });
      }
      const u = normUsage(d.usage);
      const exit = val(d.exitCode);
      byLane.get(key).spans.push({
        a: st,
        b: Math.max(en, st + 15000),
        kind: exit === 0 || exit === null ? "ok" : "aborted",
        desc: `${d.record || "派发"}${d.ticket ? ` (#${d.ticket})` : ""} · ${val(d.category) || "执行"} · ${fmtMin(val(d.minutes))}${u ? ` · 新读 ${fmtTok(u.fresh)} / 写 ${fmtTok(u.output)}` : ""}`
      });
    }
    if (!byLane.size) {
      for (const l of val(S && S.dispatchLanes) || []) {
        const sp = ((val(l.time) || {}).spans || []).map((s) => ({ a: Date.parse(s.start), b: Date.parse(s.end), kind: "ok", desc: `${fwInfo(l.framework).label} 派发时段` })).filter((s) => Number.isFinite(s.a) && Number.isFinite(s.b));
        if (sp.length) lanes.push({ actorId: "", label: `派发 · ${fwInfo(l.framework).label}`, color: fwInfo(l.framework).solid, spans: sp });
      }
    } else {
      lanes.push(...byLane.values());
    }
    const vSpans = ((val(S && S.time && S.time.verification) || {}).spans || []).map((s) => ({ a: Date.parse(s.start), b: Date.parse(s.end), kind: "ok", desc: "验证与门禁检查" })).filter((s) => Number.isFinite(s.a) && Number.isFinite(s.b));
    if (vSpans.length) lanes.push({ actorId: "", label: "验证门禁", color: "var(--verify)", spans: vSpans });
    const wSpans = ((val(S && S.time && S.time.waitingUser) || {}).spans || []).map((s) => ({ a: Date.parse(s.start), b: Date.parse(s.end), kind: "wait", desc: "等用户确认 (10~45m)" })).filter((s) => Number.isFinite(s.a) && Number.isFinite(s.b));
    if (wSpans.length) lanes.push({ actorId: "", label: "等你确认", color: "var(--wait)", spans: wSpans });
    return lanes;
  };

  const TL_LANES = collectAllSpans();
  const allPts = TL_LANES.flatMap((l) => l.spans);
  const minTs = allPts.length ? Math.min(...allPts.map((s) => s.a)) : (S && S.startedAt ? Date.parse(S.startedAt) : null);
  const maxTs = allPts.length ? Math.max(...allPts.map((s) => s.b)) : (S && S.cutoffAt ? Date.parse(S.cutoffAt) : null);
  const wallMin = minTs !== null && maxTs !== null && maxTs >= minTs ? (maxTs - minTs) / 60000 : null;

  const unionActiveMin = (() => {
    const workSpans = TL_LANES.filter((l) => l.color !== "var(--wait)").flatMap((l) => l.spans).map((s) => [s.a, s.b]).sort((x, y) => x[0] - y[0]);
    if (!workSpans.length) return dLeadMin + dispSlotMin + verSlotMin || null;
    const merged = [];
    for (const [a, b] of workSpans) {
      const last = merged[merged.length - 1];
      if (last && a <= last[1]) last[1] = Math.max(last[1], b);
      else merged.push([a, b]);
    }
    return merged.reduce((s, [a, b]) => s + (b - a) / 60000, 0);
  })();

  const goals = R.goals || [];
  const judgedGoals = goals.filter((g) => g.status !== "info");
  const metGoals = judgedGoals.filter((g) => g.status === "good" || g.status === "达成").length;
  const engDispatches = dispatches.filter((d) => (d.seat || (d.ticket ? "engineering" : "review")) === "engineering");
  const ticketIds = [...new Set(engDispatches.map((d) => d.ticket).filter((t) => t !== null && t !== undefined))];
  const reworkTickets = new Set(engDispatches.filter((d) => val(d.category) === "返工" || /^gh-\d+-\d+$/.test(d.record || "") || (val(d.exitCode) !== null && val(d.exitCode) !== 0)).map((d) => d.ticket).filter(Boolean));
  const firstPassCount = Math.max(0, ticketIds.length - reworkTickets.size);
  const passPct = ticketIds.length ? Math.round((firstPassCount / ticketIds.length) * 100) : 100;

  const KPIS = [
    {
      v: judgedGoals.length ? `${metGoals} / ${judgedGoals.length}` : `${(R.delivered || []).length} 项`,
      k: judgedGoals.length ? "量化与核对目标达成" : "核心模块交付",
      n: goals.length > judgedGoals.length ? `另 ${goals.length - judgedGoals.length} 项仅报告对比` : `交付 ${(R.delivered || []).length} 组模块`,
      pct: judgedGoals.length ? Math.round((metGoals / judgedGoals.length) * 100) : 100,
      color: "var(--good)"
    },
    {
      v: ticketIds.length ? `${firstPassCount} / ${ticketIds.length}` : "100%",
      k: ticketIds.length ? `工程工单一次通过 ${passPct}%` : "纯主会话定稿闭环",
      n: dispatches.length ? `共 ${dispatches.length} 次派发 · 合并 ${merges ? merges.landCount : ticketIds.length} 次` : "外部 CLI 派发 0 次",
      pct: passPct,
      color: "var(--agy)"
    },
    {
      v: fmtMin(unionActiveMin),
      k: "Agent 净干活时长",
      n: wallMin !== null ? `日历跨度 ${fmtMin(wallMin)}${longPauseMin > 0 ? `（停工 ${fmtMin(longPauseMin)}）` : ""}` : "按有效记录汇总",
      pct: wallMin ? Math.min(100, Math.max(18, Math.round(((unionActiveMin || 0) / wallMin) * 100))) : 80,
      color: "var(--pi)"
    },
    {
      v: fmtTok(totalRealTok),
      k: "真实干活 Token (新读+写出)",
      n: totalFresh !== null ? `首次新读 ${fmtTok(totalFresh)} · 写出 ${fmtTok(totalOut)}` : "部分旧日志未记分项",
      pct: totalRealTok !== null && totalCached !== null ? Math.max(12, Math.min(98, 100 - Math.round((totalCached / Math.max(1, totalRealTok + totalCached)) * 80))) : 75,
      color: "var(--design)"
    }
  ];

  const SHOTS = [
    ...(R.shots || []),
    ...(R.shots && R.shots.length ? [] : (R.evidence || []).filter((e) => e.image).map((e, i) => ({
      title: e.claim || `实测截图 ${i + 1}`,
      url: e.link || `spec-${R.spec}/evidence-${i + 1}`,
      focus: e.value || e.output || "",
      ref: "实测取证",
      image: e.image,
      imageAlt: e.imageAlt || e.claim || "实测截图"
    })))
  ];

  const TAKEAWAYS = (R.takeaways && R.takeaways.length) ? R.takeaways : [
    {
      title: "⏱ 耗时与并发结构",
      body: `净干活 ${fmtMin(unionActiveMin)}（设计 ${fmtMin(dLeadMin)} · 派发 ${fmtMin(dispSlotMin)} · 验证 ${fmtMin(verSlotMin)}）${longPauseMin > 0 ? `，已自动剥离 ${fmtMin(longPauseMin)} 长停工空档` : ""}。`
    },
    {
      title: "🏅 四元组协作表现",
      body: `共 ${ACTORS.length} 组（角色·框架·模型·思考强度）参演；${ver ? `完整验证 ${ver.fullCount} 次、静态检查 ${ver.staticCount} 次，` : ""}流程故障 0 次。`
    },
    {
      title: "🧮 Token 账面拆解",
      body: totalRealTok !== null
        ? `真实新读 ${fmtTok(totalFresh)} + 思考写出 ${fmtTok(totalOut)}${totalCached ? `；另 ${fmtTok(totalCached)} 为多轮工具自动复用的打折历史缓存` : ""}。`
        : "部分历史记录未包含缓存分项，详见下方四元组表与数据口径。"
    }
  ];

  const state = {
    topTab: "overview",
    costLens: "charts",
    filterActor: null,
    sidebarCollapsed: false,
    expandAll: false
  };

  document.title = `spec #${R.spec} 汇报：${R.title || ""}`;

  const renderKpiRing = (pct, color) => {
    const r = 18, c = 2 * Math.PI * r;
    const p = Math.max(0, Math.min(100, Number(pct) || 0));
    const dash = (Math.max(6, p) / 100) * c;
    return `<svg class="kpi-ring" viewBox="0 0 46 46" aria-hidden="true">
      <circle cx="23" cy="23" r="${r}" fill="none" stroke="var(--wash2)" stroke-width="4.5"/>
      <circle cx="23" cy="23" r="${r}" fill="none" stroke="${color}" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 23 23)"/>
      <text x="23" y="26.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)">${p}%</text>
    </svg>`;
  };

  const renderArchFlow = () => {
    const nodes = R.archNodes || [];
    if (!nodes.length) return "";
    const n = Math.min(nodes.length, 4);
    const W = 880, pad = 10, arrowW = n > 1 ? 66 : 0;
    const boxW = Math.floor((W - pad * 2 - arrowW * (n - 1)) / n);
    return `<div class="arch-card">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px;font-size:12px" class="muted">
        <span><b style="color:var(--ink)">交互式运作机制图</b>（悬停节点查看底层实现与门禁细节）</span>
        <span>端到端闭环</span>
      </div>
      <svg class="viz" viewBox="0 0 ${W} 82" role="img" aria-label="关键机制流转图">
        ${nodes.slice(0, n).map((nd, i) => {
          const x = pad + i * (boxW + arrowW);
          const stroke = i === 0 ? "var(--axis)" : i === n - 1 ? "var(--verify)" : "var(--agy)";
          const arrow = i < n - 1 ? `
            <line x1="${x + boxW + 4}" y1="41" x2="${x + boxW + arrowW - 10}" y2="41" stroke="var(--agy)" stroke-width="2"/>
            <polygon points="${x + boxW + arrowW - 10},37 ${x + boxW + arrowW - 2},41 ${x + boxW + arrowW - 10},45" fill="var(--agy)"/>
          ` : "";
          return `<g class="arch-node" data-tip="${esc(nd.tip || nd.sub || nd.title)}">
            <rect x="${x}" y="12" width="${boxW}" height="58" rx="10" fill="var(--surface)" stroke="${stroke}" stroke-width="1.6"/>
            <text x="${x + boxW / 2}" y="36" text-anchor="middle" font-weight="700" fill="var(--ink)">${esc(nd.title)}</text>
            <text x="${x + boxW / 2}" y="55" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(nd.sub || "")}</text>
          </g>${arrow}`;
        }).join("")}
      </svg>
    </div>`;
  };

  const renderDeliveryPanel = () => {
    const story = R.story || null;
    const delivered = R.delivered || [];
    const storyHtml = story && (story.before || (story.afterSteps && story.afterSteps.length)) ? `
      <div class="story-compare">
        <div class="story-pane before">
          <div class="pane-kicker" style="color:var(--serious)"><span>⚠ 改动前的痛点与根因</span></div>
          <div style="font-size:13px;color:var(--ink2);line-height:1.65">${esc(story.before || "见下方模块说明")}</div>
        </div>
        <div class="story-pane after">
          <div class="pane-kicker" style="color:var(--good)"><span>✦ 现在的端到端运作闭环</span></div>
          <ol class="step-pills">
            ${(story.afterSteps || []).map((s, i) => `<li><span class="step-num">${i + 1}</span><span>${esc(s)}</span></li>`).join("")}
          </ol>
        </div>
      </div>` : "";
    const modHtml = delivered.length ? `<div class="module-grid">
      ${delivered.map((d) => `<div class="module-card">
        <div class="module-top">
          <b style="font-size:13.5px">${esc(d.what)}</b>
          <span>${(d.tickets || []).map((t) => {
            const href = issueHref(t);
            const txt = String(t).startsWith("#") || !/^\d+$/.test(String(t)) ? String(t) : `#${t}`;
            return href ? `<a class="ticket-tag" href="${esc(href)}">${esc(txt)}</a>` : `<span class="ticket-tag">${esc(txt)}</span>`;
          }).join(" ")}</span>
        </div>
        <div style="font-size:12.5px;color:var(--ink2)">${esc(d.meaning || "")}</div>
      </div>`).join("")}
    </div>` : `<div class="muted">暂无交付模块明细。</div>`;
    return storyHtml + renderArchFlow() + modHtml;
  };

  const badgeFor = (st, txt) => {
    const cls = st === "good" || st === "达成" ? "good" : st === "info" ? "info" : st === "critical" ? "crit" : "warn";
    const icon = cls === "good" ? "✓" : cls === "info" ? "i" : "!";
    return `<span class="badge ${cls}">${icon} ${esc(txt || st || "核对")}</span>`;
  };

  const renderGoalsPanel = () => {
    const goalHtml = goals.length ? `<div class="goal-cards">
      ${goals.map((g) => {
        const ev = g.evidence || {};
        const proof = g.proof || ev.output || ev.value || "见核验方法";
        const unit = g.unit ? ` ${g.unit}` : "";
        const plain = g.plainWhy || ev.value || g.statusText || "";
        const links = (g.links || []).map((l) => `<a href="${esc(l.href)}">${esc(l.text)}</a>`).join(" · ");
        return `<div class="goal-card">
          <div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:13.5px">
              <span>${esc(g.name)}</span>
              ${badgeFor(g.status, g.statusText || g.status)}
            </div>
            <div class="delta-pill">
              <span class="muted">改前</span> <b>${esc(g.before !== undefined ? `${g.before}${unit}` : "未知")}</b>
              <span style="color:var(--agy);font-weight:700">→</span>
              <span class="muted">改后</span> <b style="color:var(--good)">${esc(g.after !== undefined ? `${g.after}${unit}` : "未知")}</b>
              ${g.target !== undefined ? `<span class="muted">（目标 ${esc(`${g.target}${unit}`)}）</span>` : ""}
            </div>
            ${plain ? `<div style="font-size:12.5px;color:var(--ink2);margin-bottom:3px"><b>实测结论：</b>${esc(plain)}</div>` : ""}
            ${g.method ? `<div class="muted">怎么测：${esc(g.method)}</div>` : ""}
            ${links ? `<div style="margin-top:4px;font-size:12px">${links}</div>` : ""}
          </div>
          <div>
            <div class="muted" style="margin-bottom:3px">实测回执与摘要：</div>
            <pre class="proof">${esc(proof)}</pre>
          </div>
        </div>`;
      }).join("")}
    </div>` : `<div class="muted" style="margin-bottom:12px">问题陈述未列单独量化项，判断依据见「机制与交付」。</div>`;

    const shotsHtml = SHOTS.length ? `
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 8px;flex-wrap:wrap;gap:8px">
        <b style="font-size:13.5px">🖥 前端与视觉实测画廊（点击任意画面打开高清灯箱）</b>
        <span class="muted">共 ${SHOTS.length} 张实测画面</span>
      </div>
      <div class="browser-grid">
        ${SHOTS.map((s, idx) => `<div class="browser-frame">
          <div class="browser-bar">
            <span class="traffic"><i style="background:#ef4444"></i><i style="background:#f59e0b"></i><i style="background:#22c55e"></i></span>
            <span class="url-pill">${esc(s.url || `spec-${R.spec}`)}</span>
            <span class="muted">${esc(s.ref || "实测")}</span>
          </div>
          <div class="browser-canvas" data-shot="${idx}" role="button" tabindex="0" aria-label="点击放大查看 ${esc(s.title)}">
            ${s.image ? `<img src="${esc(s.image)}" alt="${esc(s.imageAlt || s.title)}">` : (s.svg || "")}
          </div>
          <div class="browser-foot">
            <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">
              <b>${esc(s.title)}</b>
              <span style="color:var(--agy);font-weight:600;font-size:11.5px">🔍 点击灯箱放大</span>
            </div>
            ${s.focus ? `<div class="muted" style="margin-top:3px;color:var(--ink2)">${esc(s.focus)}</div>` : ""}
          </div>
        </div>`).join("")}
      </div>` : `<div class="muted" style="padding:9px 12px;border-radius:8px;background:var(--wash);margin-bottom:12px">本专项无新增前端页面截图（或为纯命令行/后端改造），关键证据见下方实测抽查卡。</div>`;

    const extraEv = (R.evidence || []).filter((e) => !e.image || (R.shots && R.shots.length));
    const evHtml = extraEv.length ? `
      <div style="font-weight:700;font-size:13.5px;margin:10px 0 8px">🔎 关键实测证据抽查</div>
      <div class="goal-cards" style="margin-bottom:0">
        ${extraEv.map((e) => `<div class="goal-card">
          <div>
            <b style="font-size:13px">${esc(e.claim)}</b>
            ${e.value ? `<div style="margin-top:4px;font-weight:600;color:var(--good);font-size:12.5px">${esc(e.value)}</div>` : ""}
            ${e.link ? `<div style="margin-top:4px;font-size:12px"><a href="${esc(e.link)}">${esc(e.linkText || "查看记录")}</a></div>` : ""}
          </div>
          <div><pre class="proof">${esc(e.output || e.value || "已核实")}</pre></div>
        </div>`).join("")}
      </div>` : "";
    return goalHtml + shotsHtml + evHtml;
  };

  const renderRisksPanel = () => {
    const risks = R.risks || [];
    if (!risks.length) return `<div class="muted">本轮无未决风险或遗留项。</div>`;
    const lvlMap = { good: ["good", "✓ 已闭环"], warning: ["warn", "! 留意边界"], warn: ["warn", "! 留意边界"], serious: ["warn", "! 中风险"], critical: ["crit", "✕ 高风险"] };
    return `<div class="risk-grid">
      ${risks.map((r) => {
        const [cls, txt] = lvlMap[r.level] || ["warn", "! 留意"];
        return `<div class="risk-card">
          <div><span class="badge ${cls}">${txt}</span> <b style="font-size:13.5px">${esc(r.what)}</b></div>
          ${r.impact ? `<div style="font-size:13px;color:var(--ink2)"><b>影响与边界：</b>${esc(r.impact)}</div>` : ""}
          ${r.next ? `<div class="muted"><b>下一步去向：</b>${esc(r.next)}</div>` : ""}
        </div>`;
      }).join("")}
    </div>`;
  };

  const buildTimeAxis = () => {
    if (!allPts.length) return null;
    const sorted = [...allPts].sort((x, y) => x.a - y.a);
    const GAP_MS = 45 * 60000;
    const segs = [];
    for (const sp of sorted) {
      const last = segs[segs.length - 1];
      if (last && sp.a - last[1] <= GAP_MS) last[1] = Math.max(last[1], sp.b);
      else segs.push([sp.a, sp.b]);
    }
    const activeMs = segs.reduce((s, [a, b]) => s + Math.max(1000, b - a), 0) || 1;
    return { segs, activeMs };
  };
  const AXIS = buildTimeAxis();

  const renderTimelineBox = () => {
    if (!AXIS || !TL_LANES.length) {
      return `<div class="timeline-box"><div data-slot="timeline"><div class="muted">评分表暂无可视化时段记录。</div></div></div>`;
    }
    const W = 920, LW = 196, RP = 14, PW = W - LW - RP, rowH = 26;
    const gapCount = AXIS.segs.length - 1;
    const gapPx = 22;
    const usable = Math.max(120, PW - gapCount * gapPx);
    const offsets = [];
    let cur = LW;
    for (const [a, b] of AXIS.segs) {
      offsets.push(cur);
      cur += (Math.max(1000, b - a) / AXIS.activeMs) * usable + gapPx;
    }
    const xOf = (t) => {
      for (let i = 0; i < AXIS.segs.length; i += 1) {
        const [a, b] = AXIS.segs[i];
        if (t <= b || i === AXIS.segs.length - 1) {
          const clamped = Math.max(a, Math.min(b, t));
          return offsets[i] + ((clamped - a) / AXIS.activeMs) * usable;
        }
        if (t < AXIS.segs[i + 1][0]) {
          const nextA = AXIS.segs[i + 1][0];
          return offsets[i + 1] - gapPx + ((t - b) / Math.max(1, nextA - b)) * gapPx;
        }
      }
      return W - RP;
    };
    const topPad = gapCount ? 22 : 8;
    const H = topPad + TL_LANES.length * rowH + 22;
    const foldedMin = AXIS.segs.slice(1).reduce((s, [a], i) => s + (a - AXIS.segs[i][1]) / 60000, 0);

    return `<div class="timeline-box">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:12px" class="muted">
        <span><b style="color:var(--ink)">全局并发泳道时间线</b>（悬停色块查看时段、工单与真实 Token）</span>
        <span>日历跨度 ${fmtMin(wallMin)}${foldedMin >= 45 ? ` · 已自动折叠 ${fmtMin(foldedMin)} 停工空档` : ""}</span>
      </div>
      <div data-slot="timeline">
        <svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="分角色与框架并发泳道时间线">
          ${AXIS.segs.slice(1).map(([a], i) => {
            const bx = offsets[i + 1] - gapPx;
            const gapM = (a - AXIS.segs[i][1]) / 60000;
            return `<g data-tip="${esc(`长停工空档 ${fmtMin(gapM)}（${fmtClock(AXIS.segs[i][1])}–${fmtClock(a)}），不计入有效干活时长`)}">
              <text x="${(bx + gapPx / 2).toFixed(1)}" y="12" text-anchor="middle" font-size="9.5">折叠 ${fmtMin(gapM)}</text>
              <rect x="${bx.toFixed(1)}" y="15" width="${gapPx}" height="${H - 35}" rx="3" fill="var(--wash2)"/>
              <line x1="${(bx + gapPx / 2).toFixed(1)}" y1="16" x2="${(bx + gapPx / 2).toFixed(1)}" y2="${H - 21}" stroke="var(--axis)" stroke-dasharray="3 3"/>
            </g>`;
          }).join("")}
          ${TL_LANES.map((lane, idx) => {
            const y = topPad + idx * rowH;
            const dim = state.filterActor && lane.actorId && state.filterActor !== lane.actorId ? 0.22 : 1;
            return `<g opacity="${dim}">
              <text x="${LW - 8}" y="${y + 16}" text-anchor="end">${esc(lane.label)}</text>
              <rect x="${LW}" y="${y + 4}" width="${PW}" height="16" rx="4" fill="var(--wash)"/>
              ${lane.spans.map((sp) => {
                const x1 = xOf(sp.a);
                const x2 = Math.max(x1 + 3.5, Math.min(W - RP, xOf(sp.b)));
                const tip = `${lane.label}\n${fmtClock(sp.a)}–${fmtClock(sp.b)}（${fmtMin((sp.b - sp.a) / 60000)}）\n${sp.desc}`;
                if (sp.kind === "aborted") {
                  return `<rect class="tl-span" data-tip="${esc(tip)}" x="${x1.toFixed(1)}" y="${y + 4}" width="${(x2 - x1).toFixed(1)}" height="16" rx="3" fill="none" stroke="var(--critical)" stroke-width="1.6" stroke-dasharray="3 2"/>`;
                }
                return `<rect class="tl-span" data-tip="${esc(tip)}" x="${x1.toFixed(1)}" y="${y + 4}" width="${(x2 - x1).toFixed(1)}" height="16" rx="3" fill="${lane.color}"/>`;
              }).join("")}
            </g>`;
          }).join("")}
          <line x1="${LW}" y1="${H - 17}" x2="${W - RP}" y2="${H - 17}" stroke="var(--axis)"/>
          <text x="${LW}" y="${H - 4}">${fmtClock(AXIS.segs[0][0])}</text>
          <text x="${W - RP}" y="${H - 4}" text-anchor="end">${fmtClock(AXIS.segs[AXIS.segs.length - 1][1])}</text>
        </svg>
      </div>
    </div>`;
  };

  const renderDonutSvg = (segments, centerTop, centerSub, unitFn) => {
    const valid = segments.filter((s) => typeof s.val === "number" && s.val > 0);
    if (!valid.length) return `<div class="muted">暂无分项构成数据。</div>`;
    const total = valid.reduce((s, x) => s + x.val, 0) || 1;
    const r = 60, cx = 84, cy = 84, circum = 2 * Math.PI * r;
    let offset = 0;
    const arcs = valid.map((seg) => {
      const len = (seg.val / total) * circum;
      const pct = Math.round((seg.val / total) * 100);
      const tip = `${seg.label}：${unitFn(seg.val)}（占 ${pct}%）\n${seg.desc || ""}`;
      const arc = `<circle class="donut-slice" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="21" stroke-dasharray="${Math.max(1.5, len - 1.2).toFixed(2)} ${circum.toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})" data-tip="${esc(tip)}" data-center-val="${esc(unitFn(seg.val))}" data-center-lbl="${esc(`${seg.label} (${pct}%)`)}"/>`;
      offset += len;
      return arc;
    }).join("");
    return `<div class="donut-wrap">
      <svg viewBox="0 0 168 168" width="148" height="148" role="img" aria-label="${esc(centerSub)}">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--wash)" stroke-width="21"/>
        ${arcs}
        <text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="15" font-weight="750" fill="var(--ink)" class="donut-center-v">${esc(centerTop)}</text>
        <text x="${cx}" y="${cy + 15}" text-anchor="middle" font-size="10" fill="var(--muted)" class="donut-center-k">${esc(centerSub)}</text>
      </svg>
      <div class="donut-legend">
        ${valid.map((seg) => {
          const pct = Math.round((seg.val / total) * 100);
          return `<div class="legend-item" data-tip="${esc(`${seg.label}：${unitFn(seg.val)}（${pct}%）— ${seg.desc || ""}`)}">
            <span style="display:inline-flex;align-items:center;gap:6px;min-width:0"><i class="swatch" style="background:${seg.color}"></i><span>${esc(seg.label)}</span></span>
            <b class="num" style="white-space:nowrap">${esc(unitFn(seg.val))} <span class="muted">(${pct}%)</span></b>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  };

  const renderGroupedBarSvg = () => {
    if (!ACTORS.length) return `<div class="muted">暂无席位耗时与用量记录。</div>`;
    const maxMin = Math.max(...ACTORS.map((a) => a.minutes || 0), 1);
    const maxTok = Math.max(...ACTORS.map((a) => (a.fresh || 0) + (a.output || 0)), 1);
    const W = 560, L = 142, Rpad = 148, PW = W - L - Rpad, rowH = 52, H = 12 + ACTORS.length * rowH;
    return `<svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="各席位耗时与真实干活Token分组柱状图">
      ${ACTORS.map((a, idx) => {
        const fw = fwInfo(a.fw);
        const y = 6 + idx * rowH;
        const wMin = a.minutes ? Math.max(4, (a.minutes / maxMin) * PW) : 0;
        const wFresh = a.fresh ? Math.max(4, (a.fresh / maxTok) * PW) : 0;
        const wOut = a.output ? Math.max(3, (a.output / maxTok) * PW) : 0;
        const dim = state.filterActor && state.filterActor !== a.id ? "dimmed" : "";
        const tip = `${a.role} · ${fw.label} · ${a.model} (思考:${a.effort})\n时长：${fmtMin(a.minutes)}（${a.runsText}）\n首次新读：${fmtTok(a.fresh)} · 思考写出：${fmtTok(a.output)}`;
        return `<g class="bar-chart-row ${dim}" data-tip="${esc(tip)}" data-actor="${esc(a.id)}">
          <rect class="bar-bg" x="2" y="${y - 3}" width="${W - 4}" height="${rowH - 4}" rx="7" fill="transparent"/>
          <text x="${L - 8}" y="${y + 13}" text-anchor="end" font-weight="600" fill="var(--ink)">${esc(a.role)}</text>
          <text x="${L - 8}" y="${y + 28}" text-anchor="end" font-size="10.5" fill="var(--muted)">${esc(`${fw.label} · ${a.effort}`)}</text>
          <rect x="${L}" y="${y + 3}" width="${PW}" height="12" rx="6" fill="var(--wash)"/>
          ${wMin ? `<rect x="${L}" y="${y + 3}" width="${wMin.toFixed(1)}" height="12" rx="6" fill="${fw.hex}"/>` : ""}
          <text x="${W - 6}" y="${y + 13}" text-anchor="end" font-weight="600" fill="var(--ink)">${esc(fmtMin(a.minutes))}</text>
          <rect x="${L}" y="${y + 20}" width="${PW}" height="12" rx="6" fill="var(--wash)"/>
          ${wFresh ? `<rect x="${L}" y="${y + 20}" width="${wFresh.toFixed(1)}" height="12" rx="6" fill="#3b82f6" opacity="0.84"/>` : ""}
          ${wOut ? `<rect x="${(L + Math.min(PW - wOut, wFresh)).toFixed(1)}" y="${y + 20}" width="${wOut.toFixed(1)}" height="12" rx="4" fill="#16a34a"/>` : ""}
          <text x="${W - 6}" y="${y + 30}" text-anchor="end" font-size="10.5" fill="var(--muted)">${esc(a.fresh !== null ? `新读${fmtTok(a.fresh)}·写${fmtTok(a.output)}` : "用量未记录")}</text>
        </g>`;
      }).join("")}
    </svg>`;
  };

  const renderChartsLens = () => {
    const timeSegs = [
      { label: "设计统筹 / 主会话", val: dLeadMin, color: "#d97706", desc: "Spec 定稿、拆单、设计工单与验收把关" },
      { label: "派发写码 / 审查", val: dispSlotMin, color: "#0d9488", desc: "各工程与审查席位并发去重后的活跃时长" },
      { label: "验证门禁与排队", val: verSlotMin, color: "#7c3aed", desc: "静态检查、land 完整验证与本机 CI" },
      { label: "等你确认 (10~45m)", val: waitUserMin, color: "#db2777", desc: "等待人工反馈与拍板确认的真实间隔" },
      { label: "长停工空档 (>45m)", val: longPauseMin, color: "#94a3b8", desc: "超过 45 分钟的跨夜或配额等待，已从干活时长剥离" }
    ];
    return `<div class="chart-split">
      <div class="chart-card">
        <div>
          <div class="chart-title">🍩 时间去向构成环形图（悬停扇区查看明细）</div>
          <div class="chart-sub">把「真干活」「等你确认」与「>45m 停工空档」彻底拆开</div>
        </div>
        ${renderDonutSvg(timeSegs, fmtMin(unionActiveMin), "净干活时长", fmtMin)}
      </div>
      <div class="chart-card">
        <div>
          <div class="chart-title">📊 各席位耗时 vs 真实干活 Token 分组柱状图</div>
          <div class="chart-sub">上柱 = 活跃时长，下柱 = 首次新读材料(蓝) + 思考与写出(绿)；点击行筛选该角色</div>
        </div>
        <div style="margin:auto 0">${renderGroupedBarSvg()}</div>
      </div>
    </div>`;
  };

  const renderTokensLens = () => {
    const tokSegs = [
      { label: "首次新读材料", val: totalFresh || 0, color: "#2563eb", desc: "首次读入上下文的代码、文档与测试输出" },
      { label: "思考与写出", val: totalOut || 0, color: "#16a34a", desc: "模型推理链与产出的代码、审查和汇报" },
      { label: totalTurns ? `多轮历史缓存重读(${totalTurns}轮)` : "多轮历史缓存重读", val: totalCached || 0, color: "#94a3b8", desc: "每轮工具调用自动重发的前文历史，命中缓存大幅打折" }
    ];
    const palette = ["#2563eb", "#0d9488", "#ea580c", "#7c3aed", "#db2777", "#4f46e5"];
    const seatSegs = ACTORS.map((a, i) => ({
      label: `${a.role} (${fwInfo(a.fw).label})`,
      val: (a.fresh || 0) + (a.output || 0),
      color: palette[i % palette.length],
      desc: `${a.model} · 思考:${a.effort}｜首次新读 ${fmtTok(a.fresh)} + 思考写出 ${fmtTok(a.output)}`
    }));
    const maxReal = Math.max(...ACTORS.map((a) => (a.fresh || 0) + (a.output || 0)), 1);

    return `<div class="two-col">
      <div class="chart-card">
        <div>
          <div class="chart-title">🧮 账面总 Token 三段式结构图</div>
          <div class="chart-sub">灰色是工具多轮调用自动重发的历史缓存，蓝绿才是真实新读与思考产出</div>
        </div>
        ${renderDonutSvg(tokSegs, fmtTok(totalRealTok), "首次新读 + 写出", fmtTok)}
      </div>
      <div class="chart-card">
        <div>
          <div class="chart-title">🥧 真实干活 Token 按四元组席位占比</div>
          <div class="chart-sub">剔除缓存重读噪音后，对比各角色与模型的真实干活投入</div>
        </div>
        ${renderDonutSvg(seatSegs, fmtTok(totalRealTok), `${ACTORS.length} 个席位合计`, fmtTok)}
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">🏅 四元组（角色/席位 · 框架 · 模型 · 思考强度）投入产出对比表</div>
      <div class="chart-sub">固定拆分首次新读材料、思考与写出、多轮历史缓存重读及可写席位动手前读档耗时</div>
      <div class="tw">
        <table class="clean">
          <thead>
            <tr>
              <th>角色/席位 · 框架 · 模型 · 思考强度</th>
              <th>活跃时长</th>
              <th>首次新读材料 + 思考与写出</th>
              <th>多轮历史缓存重读</th>
              <th>完成情况与动手前读档耗时</th>
            </tr>
          </thead>
          <tbody>
            ${ACTORS.map((a) => {
              const fw = fwInfo(a.fw);
              const fPct = a.fresh ? (a.fresh / maxReal) * 100 : 0;
              const oPct = a.output ? Math.max(2.5, (a.output / maxReal) * 100) : 0;
              const dim = state.filterActor && state.filterActor !== a.id ? 'style="opacity:.25"' : "";
              return `<tr ${dim}>
                <td>
                  <div style="font-weight:700"><span class="actor-dot" style="background:${fw.solid};margin-right:5px"></span>${esc(a.role)} <span class="effort-pill">思考:${esc(a.effort)}</span></div>
                  <div class="model-line">${esc(`${fw.label} · ${a.model} · ${a.runsText}`)}</div>
                </td>
                <td class="num"><b>${esc(fmtMin(a.minutes))}</b><div class="muted">${esc(a.runsText)}</div></td>
                <td>
                  <div class="mini-bar">
                    <div style="width:${fPct.toFixed(1)}%;background:${fw.solid}"></div>
                    <div style="width:${oPct.toFixed(1)}%;background:var(--out)"></div>
                  </div>
                  <div class="num" style="margin-top:3px">首次新读 <b>${esc(fmtTok(a.fresh))}</b> · 思考写出 <b style="color:var(--good)">${esc(fmtTok(a.output))}</b></div>
                  ${a.note ? `<div style="color:var(--warning);font-size:11px">⚠ ${esc(a.note)}</div>` : ""}
                </td>
                <td class="num"><b>${esc(fmtTok(a.cached))}</b><div class="muted">${esc(a.turns !== null ? `${a.turns} 轮工具调用` : "轮数未记录")}</div></td>
                <td><b>${esc(a.pass)}</b><div class="muted">${esc(a.readDoc)}</div></td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
    </div>`;
  };

  const renderWaterfallLens = () => {
    if (!dispatches.length && !batches.length) {
      return `<div class="muted" style="padding:12px;border-radius:9px;background:var(--wash)">本场为纯主会话执行模式（0 次外部 CLI 派发，无缺项）。</div>`;
    }
    const notesMap = R.dispatchNotes || {};
    const maxMin = Math.max(1, ...dispatches.map((d) => Number(val(d.minutes)) || 0));
    const foldedSet = new Set();
    for (const b of batches) for (const rec of b.records || []) foldedSet.add(rec);

    const batchHtml = batches.map((b) => {
      const fw = fwInfo(b.framework || "agy");
      const bu = normUsage(b.usage);
      const reps = b.representatives || b.samples || [];
      return `<details class="batch-fold">
        <summary>
          <span>📦 <b>${esc(b.prefix || "批量池")}</b>（同前缀 &gt;10 批自动折叠：<b>${esc(b.succeeded ?? b.okCount ?? b.count)}/${esc(b.count)}</b> 成功）</span>
          <span class="num">${esc(fw.label)} ｜ 累计 ${esc(fmtMin(val(b.minutes) ?? b.wallMin))} · 新读 ${esc(fmtTok(bu ? bu.fresh : b.fresh))}</span>
        </summary>
        <div class="tw" style="margin-top:8px">
          <table class="clean">
            <thead><tr><th>代表记录</th><th>时长</th><th>真实干活 Token</th><th>退出码</th></tr></thead>
            <tbody>
              ${reps.map((r) => {
                const ru = normUsage(r.usage);
                return `<tr><td><code>${esc(r.record || r[0])}</code></td><td>${esc(fmtMin(val(r.minutes) ?? r[1]))}</td><td>${esc(ru ? `新读 ${fmtTok(ru.fresh)} · 写 ${fmtTok(ru.output)}` : (r[2] || "—"))}</td><td>${esc(val(r.exitCode) ?? r[3] ?? 0)}</td></tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>
      </details>`;
    }).join("");

    const visibleDispatches = dispatches.filter((d) => !foldedSet.has(d.record));
    const rowsHtml = visibleDispatches.map((d) => {
      const fw = fwInfo(d.framework || d.agent || "codex");
      const m = val(d.minutes);
      const u = normUsage(d.usage);
      const exit = val(d.exitCode);
      const ok = exit === 0 || exit === null;
      const actorId = findActorForDispatch(d);
      const dim = state.filterActor && actorId && state.filterActor !== actorId ? "dimmed" : "";
      const leftPct = AXIS && val(d.start) ? Math.max(0, Math.min(92, ((Date.parse(val(d.start)) - AXIS.segs[0][0]) / Math.max(1, AXIS.segs[AXIS.segs.length - 1][1] - AXIS.segs[0][0])) * 100)) : 0;
      const wPct = typeof m === "number" ? Math.max(4, Math.min(100 - leftPct, (m / maxMin) * 78)) : 12;
      const ov = overheadMap.get(d.record);
      const editM = ov ? val(ov.minutes) : null;
      const autoStory = notesMap[d.record] || `${ok ? "✓" : "✕"} ${val(d.category) || "派发"}${d.ticket ? ` · 工单 #${d.ticket}` : ""}${typeof editM === "number" ? ` · 读档 ${fmtMin(editM)} 后改码` : ""}${exit !== null && exit !== 0 ? `（退出码 ${exit}）` : ""}`;
      return `<div class="wf-row ${dim}">
        <div>
          <div style="font-weight:700">${esc(d.record || "未命名记录")}</div>
          <div class="model-line">${esc(`${fw.label} · ${d.actualModel || d.model || "默认"} (${d.actualEffort || d.effort || "默认"})`)}</div>
        </div>
        <div>
          <div class="wf-axis-track"><div class="wf-bar ${ok ? "" : "aborted"}" style="left:${leftPct.toFixed(1)}%;width:${wPct.toFixed(1)}%;background:${fw.solid}"></div></div>
          <div class="muted" style="font-size:11px;margin-top:2px">${esc(`${fmtTime(val(d.start))} · ${val(d.category) || why(d.category)}`)}</div>
        </div>
        <div style="color:var(--ink2)">${esc(autoStory)}</div>
        <div class="num" style="text-align:right">
          <b>${esc(typeof m === "number" ? fmtMin(m) : why(d.minutes))}</b>
          <div class="muted">${esc(u ? `新读 ${fmtTok(u.fresh)} · 写 ${fmtTok(u.output)}` : why(d.usage))}</div>
        </div>
      </div>`;
    }).join("");

    return `<div class="wf-list">${batchHtml}${rowsHtml}</div>`;
  };

  const renderFootDetails = () => {
    const findings = R.findings || [];
    const notes = [
      ...(R.notes || []).map((n) => [n.item, n.note]),
      ...((S && S.missing) || []).map((m) => [`评分表缺项：${m.field}`, m.reason]),
      ...((S && S.subagentAnomalies) || []).map((a, i) => [`子代理异常 #${i + 1}`, typeof a === "string" ? a : JSON.stringify(a)])
    ];
    const verRuns = (ver && ver.runs) || [];
    return `<details class="fold-box">
      <summary>流程发现、验证明细与数据口径（点击展开查找表）</summary>
      <div style="margin-top:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px">
        ${findings.length ? `<div style="min-width:0;overflow-wrap:anywhere"><b>流程发现</b><ul style="margin:6px 0 0;padding-left:20px">${findings.map((f) => `<li>${esc(f)}</li>`).join("")}</ul></div>` : ""}
        ${verRuns.length ? `<div style="min-width:0"><b>验证执行台账（完整 ${ver.fullCount} 次 · 静态 ${ver.staticCount} 次）</b>
          <div class="tw" style="margin-top:6px"><table class="clean">
            <thead><tr><th>层级</th><th>对象</th><th>调用方</th><th>开始时间</th><th>耗时</th><th>退出码</th></tr></thead>
            <tbody>${verRuns.map((r) => `<tr><td>${esc(r.layer === "full" ? "完整验证" : "静态检查")}</td><td>${esc(r.target && r.target.kind === "main" ? "主工作区" : `${r.target ? r.target.kind : ""} #${r.target ? r.target.number : ""}`)}</td><td><code>${esc(r.caller)}</code></td><td>${esc(fmtTime(r.start))}</td><td class="num">${esc(fmtMin(r.minutes))}</td><td class="num">${esc(r.exitCode)}</td></tr>`).join("")}</tbody>
          </table></div></div>` : ""}
        ${notes.length ? `<div style="min-width:0"><b>数据口径与缺项说明</b>
          <div class="tw" style="margin-top:6px"><table class="clean">
            <thead><tr><th>条目</th><th>说明</th></tr></thead>
            <tbody>${notes.map(([k, v]) => `<tr><td><code>${esc(k)}</code></td><td>${esc(v)}</td></tr>`).join("")}</tbody>
          </table></div></div>` : ""}
      </div>
    </details>`;
  };

  const render = () => {
    const collapsed = state.sidebarCollapsed;
    const all = state.expandAll;
    const asks = R.asks || [];
    const prText = R.pr ? `PR #${R.pr.number} · ${R.pr.state}` : "无关联 PR";

    const app = document.getElementById("app");
    app.innerHTML = `<div class="shell">
      ${collapsed ? `<div class="expand-bar">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <button type="button" class="icon-btn" id="toggle-side">» 展开左栏驾驶舱 ([)</button>
          <span class="pr-pill"><i class="pr-dot"></i>${esc(prText)}</span>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${ACTORS.map((a) => {
            const fw = fwInfo(a.fw);
            return `<button type="button" class="icon-btn ${state.filterActor === a.id ? "on" : ""}" data-actor="${esc(a.id)}"><span class="actor-dot" style="background:${fw.solid};margin-right:4px"></span>${esc(a.role)} · ${esc(fw.label)}</button>`;
          }).join("")}
        </div>
      </div>` : ""}

      <div class="cockpit-grid ${collapsed ? "collapsed" : ""}">
        <aside class="cockpit-side" ${collapsed ? "hidden" : ""}>
          <div class="side-top">
            <span class="pr-pill"><i class="pr-dot"></i>${esc(R.pr ? `PR #${R.pr.number}` : `Spec ${R.spec}`)}</span>
            <button type="button" class="icon-btn" id="toggle-side" title="快捷键 [ 收起或展开侧栏">« 收起侧栏</button>
          </div>
          <div>
            <div style="font-weight:750;font-size:14px;line-height:1.38">${esc(R.title || "")}</div>
            <div class="muted" style="margin-top:4px">${esc(R.date || "")} · Spec ${esc(R.spec)}</div>
          </div>
          <div>
            <div class="side-nav-label">快速切换视图（免滚动）</div>
            <div class="side-nav">
              <button type="button" class="nav-btn ${!all && state.topTab === "overview" ? "active" : ""}" data-jump-top="overview"><span>✦ 机制与模块交付</span><span class="nav-count">${(R.delivered || []).length}</span></button>
              <button type="button" class="nav-btn ${!all && state.topTab === "goals" ? "active" : ""}" data-jump-top="goals"><span>🎯 目标与实测画廊</span><span class="nav-count">${goals.length + SHOTS.length}</span></button>
              <button type="button" class="nav-btn ${!all && state.topTab === "risks" ? "active" : ""}" data-jump-top="risks"><span>🛡 风险与上线边界</span><span class="nav-count">${(R.risks || []).length}</span></button>
              <button type="button" class="nav-btn ${!all && state.costLens === "charts" ? "active" : ""}" data-jump-lens="charts"><span>📊 耗时饼图 & 柱状图</span><span class="nav-count">图</span></button>
              <button type="button" class="nav-btn ${!all && state.costLens === "tokens" ? "active" : ""}" data-jump-lens="tokens"><span>🧮 Token 环图 & 四元组</span><span class="nav-count">${ACTORS.length}</span></button>
              <button type="button" class="nav-btn ${!all && state.costLens === "waterfall" ? "active" : ""}" data-jump-lens="waterfall"><span>⏱ 逐单协作与返工流</span><span class="nav-count">${dispatches.length}</span></button>
            </div>
          </div>
          <div>
            <div class="side-nav-label" style="display:flex;justify-content:space-between;align-items:center">
              <span>参演四元组（点击筛选）</span>
              ${state.filterActor ? `<button type="button" class="icon-btn" id="clear-actor" style="padding:1px 6px;font-size:11px">重置</button>` : ""}
            </div>
            <div class="roster-list">
              ${ACTORS.map((a) => {
                const fw = fwInfo(a.fw);
                return `<button type="button" class="roster-card ${state.filterActor === a.id ? "active" : ""}" data-actor="${esc(a.id)}">
                  <div class="roster-row1">
                    <span style="font-weight:700;font-size:12.5px"><span class="actor-dot" style="background:${fw.solid};margin-right:5px"></span>${esc(a.role)}</span>
                    <span class="effort-pill">${esc(`${fw.label} · ${a.effort}`)}</span>
                  </div>
                  <div class="model-line">${esc(a.model)}</div>
                </button>`;
              }).join("")}
            </div>
          </div>
        </aside>

        <div>
          <header class="hero-card">
            <div class="hero-top">
              <div class="top-meta">
                <span>${esc(R.date || "")}</span><span>·</span>
                <span>${esc(R.repo || "")}</span><span>·</span>
                <span>Spec ${esc(R.spec)}</span>
                <span class="pr-pill"><i class="pr-dot"></i>${esc(prText)}</span>
              </div>
              <div class="hero-actions">
                <button type="button" class="icon-btn ${all ? "on" : ""}" id="expand-all-btn" data-action="expand-all" aria-pressed="${all ? "true" : "false"}">${all ? "返回页签切换视图" : "切换全展开长卷"}</button>
                <button type="button" class="icon-btn" id="theme-btn">深浅色切换</button>
              </div>
            </div>
            <h1>${esc(R.title || "")}</h1>
            <p class="lead">${esc(R.result || "")}</p>

            <div class="ask-banner" ${asks.length ? "" : "hidden"}>
              <div class="ask-head">⚡ 需要你拍板的事项（共 ${asks.length} 项）</div>
              <div class="ask-grid">
                ${asks.map((a, idx) => `<div class="ask-box">
                  <div><b>${idx + 1}. 【${esc(a.kind || "确认")}】${esc(a.what)}</b></div>
                  ${a.why ? `<div class="muted" style="margin:3px 0">${esc(a.why)}</div>` : ""}
                  ${(a.options || []).length ? `<div style="font-size:12px;color:var(--ink2)">选项：${esc(a.options.join(" / "))}</div>` : ""}
                  ${a.recommend || a.rec ? `<div style="color:var(--good);font-weight:600;margin-top:2px">推荐：${esc(a.recommend || a.rec)}</div>` : ""}
                </div>`).join("")}
              </div>
            </div>

            <div class="kpi-grid">
              ${KPIS.map((k) => `<div class="kpi-card">
                <div style="min-width:0">
                  <div class="kpi-val">${esc(k.v)}</div>
                  <div class="kpi-lbl">${esc(k.k)}</div>
                  <div class="kpi-sub">${esc(k.n)}</div>
                </div>
                ${renderKpiRing(k.pct, k.color)}
              </div>`).join("")}
            </div>
          </header>

          <section class="deck" id="deck-top">
            <div class="deck-head">
              <div class="deck-title"><span>1. 成果验收台</span><span class="muted">零滚动切换「机制 / 目标与画廊 / 风险」</span></div>
              <div class="seg-tabs" role="tablist" aria-label="成果验收台视图切换">
                <button type="button" role="tab" id="tab-overview" aria-controls="panel-overview" aria-selected="${all || state.topTab === "overview" ? "true" : "false"}" class="seg-tab ${!all && state.topTab === "overview" ? "active" : ""}" data-top="overview">
                  <span>✦ 改动机制与交付</span><span class="tab-badge">${(R.delivered || []).length}</span>
                </button>
                <button type="button" role="tab" id="tab-goals" aria-controls="panel-goals" aria-selected="${all || state.topTab === "goals" ? "true" : "false"}" class="seg-tab ${!all && state.topTab === "goals" ? "active" : ""}" data-top="goals">
                  <span>🎯 目标与前端截图</span><span class="tab-badge">${SHOTS.length ? `${SHOTS.length}图` : goals.length}</span>
                </button>
                <button type="button" role="tab" id="tab-risks" aria-controls="panel-risks" aria-selected="${all || state.topTab === "risks" ? "true" : "false"}" class="seg-tab ${!all && state.topTab === "risks" ? "active" : ""}" data-top="risks">
                  <span>🛡 风险与边界</span><span class="tab-badge">${(R.risks || []).length}</span>
                </button>
              </div>
            </div>
            <div role="tabpanel" id="panel-overview" aria-labelledby="tab-overview" class="tabpanel" ${all || state.topTab === "overview" ? "" : "hidden"}>${renderDeliveryPanel()}</div>
            <div role="tabpanel" id="panel-goals" aria-labelledby="tab-goals" class="tabpanel" ${all || state.topTab === "goals" ? "" : "hidden"}>${renderGoalsPanel()}</div>
            <div role="tabpanel" id="panel-risks" aria-labelledby="tab-risks" class="tabpanel" ${all || state.topTab === "risks" ? "" : "hidden"}>${renderRisksPanel()}</div>
          </section>

          <section class="deck" id="deck-cost">
            <div class="deck-head">
              <div class="deck-title"><span>2. 耗时 · Token · 模型对比图表台</span><span class="muted">过程数据全部由评分表自动生成</span></div>
              <div class="seg-tabs" role="tablist" aria-label="代价与模型对比透镜切换">
                <button type="button" role="tab" id="tab-charts" aria-controls="panel-charts" aria-selected="${all || state.costLens === "charts" ? "true" : "false"}" class="seg-tab ${!all && state.costLens === "charts" ? "active" : ""}" data-lens="charts">
                  <span>① 耗时饼图 & 模型柱状图</span>
                </button>
                <button type="button" role="tab" id="tab-tokens" aria-controls="panel-tokens" aria-selected="${all || state.costLens === "tokens" ? "true" : "false"}" class="seg-tab ${!all && state.costLens === "tokens" ? "active" : ""}" data-lens="tokens">
                  <span>② Token 环图 & 四元组表</span><span class="tab-badge">${ACTORS.length}</span>
                </button>
                <button type="button" role="tab" id="tab-waterfall" aria-controls="panel-waterfall" aria-selected="${all || state.costLens === "waterfall" ? "true" : "false"}" class="seg-tab ${!all && state.costLens === "waterfall" ? "active" : ""}" data-lens="waterfall">
                  <span>③ 逐单协作与返工流</span><span class="tab-badge">${dispatches.length}</span>
                </button>
              </div>
            </div>

            <div class="takeaway-strip">
              ${TAKEAWAYS.map((t) => `<div class="takeaway-card"><b>${esc(t.title)}</b>${esc(t.body)}</div>`).join("")}
            </div>

            ${renderTimelineBox()}

            <div role="tabpanel" id="panel-charts" aria-labelledby="tab-charts" class="tabpanel" ${all || state.costLens === "charts" ? "" : "hidden"}>${renderChartsLens()}</div>
            <div role="tabpanel" id="panel-tokens" aria-labelledby="tab-tokens" class="tabpanel" ${all || state.costLens === "tokens" ? "" : "hidden"}>${renderTokensLens()}</div>
            <div role="tabpanel" id="panel-waterfall" aria-labelledby="tab-waterfall" class="tabpanel" ${all || state.costLens === "waterfall" ? "" : "hidden"}>${renderWaterfallLens()}</div>
          </section>

          ${renderFootDetails()}

          <footer>过程数据来自评分表（<code>tickets.ts scorecard ${esc(R.spec)}</code>），截点 ${esc(fmtTime(S && S.cutoffAt))}，采集 ${esc(fmtTime(S && S.collectedAt))}。目标、证据、待拍板事项与风险由设计负责人核定填写。</footer>
        </div>
      </div>
    </div>`;
  };

  const tipEl = document.getElementById("floating-tip");
  document.addEventListener("mouseover", (ev) => {
    const holder = ev.target && ev.target.closest ? ev.target.closest("[data-tip]") : null;
    if (!holder) { tipEl.hidden = true; return; }
    tipEl.textContent = holder.getAttribute("data-tip") || "";
    tipEl.hidden = false;
    if (holder.classList.contains("donut-slice")) {
      const svg = holder.closest("svg");
      const v = svg && svg.querySelector(".donut-center-v");
      const k = svg && svg.querySelector(".donut-center-k");
      if (v && holder.dataset.centerVal) v.textContent = holder.dataset.centerVal;
      if (k && holder.dataset.centerLbl) k.textContent = holder.dataset.centerLbl;
    }
  });
  document.addEventListener("mousemove", (ev) => {
    if (tipEl.hidden) return;
    const x = Math.min(window.innerWidth - 320, ev.clientX + 14);
    const y = Math.min(window.innerHeight - 96, ev.clientY + 14);
    tipEl.style.left = `${Math.max(8, x)}px`;
    tipEl.style.top = `${Math.max(8, y)}px`;
  });
  document.addEventListener("mouseout", (ev) => {
    const holder = ev.target && ev.target.closest ? ev.target.closest("[data-tip]") : null;
    if (holder && (!ev.relatedTarget || !holder.contains(ev.relatedTarget))) tipEl.hidden = true;
  });

  document.addEventListener("click", (ev) => {
    const raw = ev.target;
    if (!raw || !raw.closest) return;
    if (raw.id === "clear-actor") {
      state.filterActor = null;
      render();
      return;
    }
    const target = raw.closest("button, [data-shot], .bar-chart-row");
    if (!target) return;
    if (target.id === "toggle-side") {
      state.sidebarCollapsed = !state.sidebarCollapsed;
      render();
      return;
    }
    if (target.getAttribute("data-action") === "expand-all") {
      state.expandAll = !state.expandAll;
      render();
      return;
    }
    if (target.id === "theme-btn") {
      const darkNow = document.documentElement.getAttribute("data-theme") === "dark" ||
        (!document.documentElement.hasAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", darkNow ? "light" : "dark");
      return;
    }
    if (target.hasAttribute("data-top")) {
      state.expandAll = false;
      state.topTab = target.getAttribute("data-top") || "overview";
      render();
      return;
    }
    if (target.hasAttribute("data-lens")) {
      state.expandAll = false;
      state.costLens = target.getAttribute("data-lens") || "charts";
      render();
      return;
    }
    if (target.hasAttribute("data-jump-top")) {
      state.expandAll = false;
      state.topTab = target.getAttribute("data-jump-top") || "overview";
      render();
      const deck = document.getElementById("deck-top");
      if (deck) deck.scrollIntoView({ behavior: "smooth", block: "nearest" });
      return;
    }
    if (target.hasAttribute("data-jump-lens")) {
      state.expandAll = false;
      state.costLens = target.getAttribute("data-jump-lens") || "charts";
      render();
      const deck = document.getElementById("deck-cost");
      if (deck) deck.scrollIntoView({ behavior: "smooth", block: "nearest" });
      return;
    }
    if (target.hasAttribute("data-actor")) {
      const id = target.getAttribute("data-actor") || null;
      state.filterActor = state.filterActor === id ? null : id;
      render();
      return;
    }
    if (target.hasAttribute("data-shot")) {
      const shot = SHOTS[Number(target.getAttribute("data-shot"))];
      if (!shot) return;
      const lb = document.getElementById("lightbox");
      document.getElementById("lightbox-body").innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:12px;flex-wrap:wrap">
          <div><b>${esc(shot.title)}</b> <span class="muted">· ${esc(shot.url || "")}</span></div>
          <button type="button" class="icon-btn" id="close-lightbox">✕ 关闭 (Esc)</button>
        </div>
        ${shot.focus ? `<div class="muted" style="margin-bottom:10px;color:var(--ink2)">${esc(shot.focus)}</div>` : ""}
        ${shot.image ? `<img src="${esc(shot.image)}" alt="${esc(shot.imageAlt || shot.title)}">` : (shot.svg || "")}
      `;
      lb.hidden = false;
    }
  });

  document.getElementById("lightbox").addEventListener("click", (ev) => {
    if (ev.target.id === "lightbox" || ev.target.id === "close-lightbox") {
      document.getElementById("lightbox").hidden = true;
    }
  });

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { document.getElementById("lightbox").hidden = true; return; }
    if (ev.target && ev.target.matches && ev.target.matches("input, textarea, [contenteditable]")) return;
    if (ev.key === "[") { state.sidebarCollapsed = !state.sidebarCollapsed; render(); }
  });

  render();
})();
</script>
</body>
</html>
