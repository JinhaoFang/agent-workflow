  const evidenceBlock = (ev) => {
    if (!ev) return null;
    const box = el("div", { class: "ev" });
    if (ev.value) box.append(el("div", { class: "num", text: ev.value }));
    if (ev.output) box.append(el("pre", { text: ev.output }));
    if (ev.image) box.append(el("img", { class: "thumb", src: ev.image, alt: ev.imageAlt || "截图" }));
    if (ev.link) box.append(el("div", {}, link(ev.linkText || "原始记录", ev.link)));
    return box;
  };
  const tip = $("tip");
  document.addEventListener("pointermove", (event) => {
    const target = event.target.closest && event.target.closest("[data-tip]");
    if (!target) { tip.hidden = true; return; }
    tip.textContent = target.getAttribute("data-tip");
    tip.hidden = false;
    const x = Math.min(event.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
    const y = Math.min(event.clientY + 12, window.innerHeight - tip.offsetHeight - 8);
    tip.style.left = `${x}px`;
    tip.style.top = `${y}px`;
  });

  document.title = `spec #${R.spec} 汇报：${R.title}`;
  $("meta").textContent = [R.date, `spec #${R.spec}`, R.pr ? `PR #${R.pr.number}（${R.pr.state}）` : null].filter(Boolean).join(" · ");
  $("title").textContent = R.title;
  $("result").textContent = R.result;
  const asks = R.asks || [];
  if (asks.length) {
    const banner = $("banner");
    banner.hidden = false;
    banner.append(el("b", { text: `有 ${asks.length} 件事要你做` }), "：", asks.map((a) => a.what).join("；"), " → 第 3 节");
  }

  const goals = R.goals || [];
  const judged = goals.filter((g) => g.status !== "info");
  const met = judged.filter((g) => g.status === "good").length;
  const dispatches = val(S && S.dispatches) || [];
  const tickets = new Set(dispatches.map((d) => d.ticket).filter((t) => t !== null && t !== undefined));
  const spanStarts = [];
  const spanEnds = [];
  if (S) for (const lane of Object.values(S.time || {})) for (const s of (val(lane) || {}).spans || []) { spanStarts.push(Date.parse(s.start)); spanEnds.push(Date.parse(s.end)); }
  const wall = spanStarts.length ? (Math.max(...spanEnds) - Math.min(...spanStarts)) / 60000 : null;
  const tile = (v, k, n) => el("div", { class: "tile" }, el("div", { class: "v", text: v }), el("div", { class: "k", text: k }), n ? el("div", { class: "n", text: n }) : null);
  put("done-tiles", 
    tile(judged.length ? `${met}/${judged.length}` : "—", "目标达成", [judged.length - met ? `${judged.length - met} 项未完全达成` : null, goals.length - judged.length ? `另 ${goals.length - judged.length} 项只报告` : null].filter(Boolean).join("，") || null),
    tile(String((R.delivered || []).length), "交付", S ? `派给 Codex 的工单 ${tickets.size} 张` : null),
    tile(fmtMin(wall), "从开工到数据截点", S ? `截点 ${fmtTime(S.cutoffAt)}` : null),
  );
  const delivered = R.delivered || [];
  put("delivered", delivered.length
    ? el("div", { class: "tw" }, el("table", {}, el("thead", {}, el("tr", {}, el("th", { text: "交付" }), el("th", { text: "工单" }), el("th", { text: "对你的意义" }))),
        el("tbody", {}, delivered.map((d) => el("tr", {}, el("td", { text: d.what }), el("td", {}, (d.tickets || []).flatMap((t, i) => (i ? [" ", issue(t)] : [issue(t)]))), el("td", { text: d.meaning }))))))
    : el("p", { class: "empty", text: "无" }));

  const dumbbell = (g, W) => {
    const nums = [g.before, g.after, g.target].filter((n) => typeof n === "number");
    if (nums.length < 2) return null;
    const max = Math.max(...nums) * 1.08 || 1;
    const H = 46, L = 6, Rr = 6, x = (n) => L + (n / max) * (W - L - Rr);
    const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${g.name}：改前 ${g.before}，改后 ${g.after}` });
    svg.append(svgEl("line", { class: "axis", x1: L, x2: W - Rr, y1: 30, y2: 30 }));
    if (typeof g.before === "number" && typeof g.after === "number") svg.append(svgEl("line", { x1: x(g.before), x2: x(g.after), y1: 18, y2: 18, stroke: "var(--axis)", "stroke-width": 2 }));
    if (typeof g.target === "number") svg.append(svgEl("line", { x1: x(g.target), x2: x(g.target), y1: 8, y2: 28, stroke: "var(--ink2)", "stroke-width": 2 }));
    const dot = (n, fill, label, anchorUp) => {
      const group = svgEl("g", { "data-tip": `${label} ${fmtNum(n, 2)} ${g.unit || ""}` });
      group.append(svgEl("circle", { cx: x(n), cy: 18, r: 10, fill: "transparent" }), svgEl("circle", { cx: x(n), cy: 18, r: 5, fill, stroke: "var(--surface)", "stroke-width": 2 }));
      const px = x(n), anchor = px < 40 ? "start" : px > W - 40 ? "end" : "middle";
      group.append(svgEl("text", { x: anchor === "start" ? Math.max(px - 4, 0) : anchor === "end" ? Math.min(px + 4, W) : px, y: anchorUp ? 8 : 44, "text-anchor": anchor }, `${label} ${fmtNum(n, 2)}`));
      return group;
    };
    if (typeof g.before === "number") svg.append(dot(g.before, "var(--muted)", "改前", true));
    if (typeof g.after === "number") svg.append(dot(g.after, "var(--s1)", "改后", false));
    return svg;
  };
  const delta = (g) => (typeof g.before === "number" && typeof g.after === "number" && g.before ? `改后比改前 ${g.after >= g.before ? "+" : ""}${fmtNum((100 * (g.after - g.before)) / g.before, 1)}%` : null);
  const drawGoals = () => {
  const gw = Math.max(240, Math.floor(($("goals").clientWidth - 16) / (innerWidth > 640 ? 2 : 1)));
  $("goals").replaceChildren();
  put("goals", goals.length ? goals.map((g) => el("div", { class: "card" },
    el("div", { class: "row" },
      el("div", {},
        el("h3", {}, g.name, " ", status(g.status || "warning", g.statusText || "")),
        g.unit ? el("div", { class: "muted", text: `单位：${g.unit}${typeof g.target === "number" ? `；目标 ${fmtNum(g.target, 2)}` : ""}` }) : null,
        dumbbell(g, gw),
        typeof g.before !== "number" || typeof g.after !== "number" ? el("div", { class: "pair" }, el("span", { class: "muted", text: "改前 " }), String(g.before ?? "未知"), el("br"), el("span", { class: "muted", text: "改后 " }), String(g.after ?? "未知")) : null,
        delta(g) ? el("div", { text: delta(g) }) : null,
        g.method ? el("div", { class: "muted", text: `怎么测：${g.method}` }) : null),
      el("div", {}, evidenceBlock(g.evidence), (g.links || []).length ? el("div", { class: "ev" }, g.links.flatMap((l, i) => (i ? [" · ", link(l.text, l.href)] : [link(l.text, l.href)]))) : null))))
    : el("p", { class: "empty", text: "问题陈述没有可度量的现状；判断方法写在第 1 节。" }));
  };

  put("asks", asks.length ? el("ol", { class: "plain" }, asks.map((a) => el("li", {},
    el("b", { text: `【${a.kind}】${a.what}` }),
    a.why ? el("div", { class: "muted", text: a.why }) : null,
    (a.options || []).length ? el("div", { text: `选项：${a.options.join(" / ")}` }) : null,
    a.recommend ? el("div", { text: `推荐：${a.recommend}` }) : null)))
    : el("p", { class: "empty", text: "这次没有要你做的事。" }));

  const evidence = R.evidence || [];
  put("evidence", evidence.length ? evidence.map((e) => el("div", { class: "card" }, el("div", { class: "row" }, el("div", {}, el("b", { text: e.claim })), evidenceBlock(e))))
    : el("p", { class: "empty", text: "无" }));

  const LANES = [
    ["codexSlots", "Codex", "var(--s1)"],
    ["verification", "验证", "var(--s2)"],
    ["queue", "排队", "var(--s3)"],
    ["designLead", "设计负责人", "var(--s4)"],
    ["waitingUser", "等用户", "var(--s5)"],
  ];
  put("lane-legend", LANES.map(([, name, c]) => el("span", { style: `--c:${c}`, text: name })));
  const timeline = () => {
    if (!S) return el("p", { class: "empty", text: "没有评分表数据。" });
    const lanes = LANES.map(([key, name, color]) => ({ key, name, color, field: S.time[key], spans: ((val(S.time[key]) || {}).spans || []).map((s) => [Date.parse(s.start), Date.parse(s.end)]) }));
    const all = lanes.flatMap((l) => l.spans).sort((a, b) => a[0] - b[0]);
    if (!all.length) return el("p", { class: "empty", text: "评分表里没有时段。" });
    const GAP = 45 * 60000;
    const segs = [];
    for (const [a, b] of all) {
      const last = segs[segs.length - 1];
      if (last && a - last[1] <= GAP) last[1] = Math.max(last[1], b);
      else segs.push([a, b]);
    }
    const W = Math.max(300, $("timeline").clientWidth), LW = W < 600 ? 64 : 92, GW = 14, ROW = 26, TOP = 6, PAD = 4;
    const active = segs.reduce((n, [a, b]) => n + (b - a), 0) || 1;
    const usable = W - LW - GW * (segs.length - 1) - PAD;
    const offsets = [];
    let cursor = LW;
    for (const [a, b] of segs) { offsets.push(cursor); cursor += ((b - a) / active) * usable + GW; }
    const x = (t) => {
      for (let i = 0; i < segs.length; i++) if (t <= segs[i][1] || i === segs.length - 1) return offsets[i] + ((Math.max(t, segs[i][0]) - segs[i][0]) / active) * usable;
      return W;
    };
    const H = TOP + lanes.length * ROW + 24;
    const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "按资源分泳道的时间线" });
    lanes.forEach((lane, i) => {
      const y = TOP + i * ROW;
      svg.append(svgEl("rect", { class: "lane", x: LW, y, width: W - LW - PAD, height: ROW - 6, rx: 3 }));
      svg.append(svgEl("text", { x: LW - 8, y: y + 14, "text-anchor": "end" }, lane.name));
      if (val(lane.field) === null) svg.append(svgEl("text", { x: LW + 8, y: y + 14 }, W < 600 ? "未记录" : `未记录：${why(lane.field)}`));
      for (const [a, b] of lane.spans) {
        const x1 = x(a), w = Math.max(x(b) - x1, 2);
        const g = svgEl("g", { "data-tip": `${lane.name}\n${fmtClock(a)}–${fmtClock(b)}（${fmtMin((b - a) / 60000)}）` });
        g.append(svgEl("rect", { x: x1 - 2, y, width: w + 4, height: ROW - 6, fill: "transparent" }), svgEl("rect", { x: x1, y: y + 3, width: w, height: ROW - 12, rx: 2, fill: lane.color }));
        svg.append(g);
      }
    });
    const base = TOP + lanes.length * ROW;
    segs.forEach(([a, b], i) => {
      if (i) {
        const gx = offsets[i] - GW / 2;
        svg.append(svgEl("line", { x1: gx - 2, x2: gx - 2, y1: TOP, y2: base - 6, stroke: "var(--axis)" }), svgEl("line", { x1: gx + 2, x2: gx + 2, y1: TOP, y2: base - 6, stroke: "var(--axis)" }));
        svg.append(svgEl("g", { "data-tip": `空档 ${fmtMin((a - segs[i - 1][1]) / 60000)}` }, svgEl("rect", { x: gx - 7, y: TOP, width: 14, height: base - TOP, fill: "transparent" })));
      }
      const px = x(b) - x(a);
      const step = [15, 30, 60, 120, 240, 480, 960].map((m) => m * 60000).find((s) => (s / Math.max(b - a, 1)) * px >= 70);
      if (!step) return;
      for (let t = Math.ceil(a / step) * step; t <= b; t += step) {
        svg.append(svgEl("line", { class: "gridl", x1: x(t), x2: x(t), y1: base - 4, y2: base }));
        svg.append(svgEl("text", { x: x(t), y: base + 14, "text-anchor": "middle" }, fmtClock(t)));
      }
    });
    return svg;
  };

  const hbars = (rows, unitFmt, ariaLabel, W) => {
    const max = Math.max(1, ...rows.map((r) => r.value || 0));
    const narrow = W < 600, LW = narrow ? 76 : 120, VW = narrow ? 120 : 280, ROW = 26;
    const svg = svgEl("svg", { viewBox: `0 0 ${W} ${rows.length * ROW + 4}`, role: "img", "aria-label": ariaLabel });
    rows.forEach((r, i) => {
      const y = i * ROW;
      svg.append(svgEl("text", { x: LW - 8, y: y + 16, "text-anchor": "end" }, r.label));
      if (r.value === null || r.value === undefined) { svg.append(svgEl("text", { x: LW, y: y + 16 }, narrow ? "未记录" : `未记录：${r.reason || "缺数"}`)); return; }
      const w = r.value > 0 ? Math.max(((W - LW - VW) * r.value) / max, 2) : 0;
      const g = svgEl("g", { "data-tip": r.tip || `${r.label}：${r.text || unitFmt(r.value)}` });
      g.append(svgEl("rect", { x: LW, y, width: W - LW - VW, height: ROW - 4, fill: "transparent" }), svgEl("rect", { x: LW, y: y + 5, width: w, height: ROW - 14, rx: 2, fill: r.color || "var(--s1)" }));
      g.append(svgEl("text", { x: LW + w + 8, y: y + 16 }, (narrow ? r.short : r.text) || unitFmt(r.value)));
      svg.append(g);
    });
    return svg;
  };

  const ver = val(S && S.verification);
  const merges = val(S && S.merges);
  const failures = S ? Object.values(S.failures || {}).map(val) : [];
  const failureSum = failures.every((n) => typeof n === "number") ? failures.reduce((a, b) => a + b, 0) : null;
  const overhead = (val(S && S.overhead) || []).map((o) => val(o.minutes)).filter((n) => typeof n === "number").sort((a, b) => a - b);
  const median = overhead.length ? overhead[Math.floor(overhead.length / 2)] : null;
  put("verify-tiles", 
    tile(ver ? `${ver.fullCount} 次` : "未记录", "完整验证", ver ? `共 ${fmtMin(ver.fullMinutes)}` : why(S && S.verification)),
    tile(ver ? `${ver.staticCount} 次` : "未记录", "静态检查"),
    tile(merges ? `${merges.landCount} 次` : "未记录", "合并（land）", merges ? `完整验证失败 ${merges.fullVerificationFailures} 次` : null),
    tile(failureSum === null ? "未知" : `${failureSum} 次`, "流程故障", "派发无汇报、land 停下、验证启动失败"),
    tile(val(S && S.userInterventions) === null || !S ? "未知" : `${val(S.userInterventions)} 次`, "用户介入"),
    tile(median === null ? "未知" : fmtMin(median), "开工开销（中位）", "派发到第一次改文件"),
  );
  if (S) {
    const n = val(S.usage.subagentNotifications);
    put("usage-note", n === null ? `任务通知里的子代理 token：未记录（${why(S.usage.subagentNotifications)}）。` : `任务通知报的子代理 token 合计 ${fmtTok(n)}，可和上面子代理一行互相核对。`);
  }

  const USAGE = [["codexDispatch", "Codex 派发"], ["codexReview", "Codex 审查"], ["mainSession", "主会话"], ["independentReview", "独立审查"], ["subagents", "子代理"]];
  const drawCharts = () => {
    drawGoals();
    for (const slot of ["timeline", "time-bars", "usage-bars"]) $(slot).replaceChildren();
    put("timeline", timeline());
    const bw = Math.max(300, $("time-bars").clientWidth);
    put("time-bars", S ? hbars(LANES.map(([key, name, color]) => ({ label: name, color, value: (val(S.time[key]) || {}).minutes ?? null, reason: why(S.time[key]) })), fmtMin, "各类时间的分钟数", bw) : el("p", { class: "empty", text: "没有评分表数据。" }));
    put("usage-bars", S ? hbars(USAGE.map(([key, label]) => {
      const u = val(S.usage[key]);
      return { label, value: u ? u.inputTokens : null, reason: why(S.usage[key]), short: u ? `输入 ${fmtTok(u.inputTokens)}` : null,
        text: u ? `输入 ${fmtTok(u.inputTokens)}（缓存 ${Math.round((100 * u.cachedInputTokens) / (u.inputTokens || 1))}%）· 输出 ${fmtTok(u.outputTokens)}` : null };
    }), fmtTok, "各来源的输入 token", bw) : el("p", { class: "empty", text: "没有评分表数据。" }));
  };
  drawCharts();
  const resize = { timer: 0, width: innerWidth };
  addEventListener("resize", () => {
    if (innerWidth === resize.width) return;
    resize.width = innerWidth;
    clearTimeout(resize.timer);
    resize.timer = setTimeout(drawCharts, 150);
  });

  const table = (head, rows) => el("div", { class: "tw" }, el("table", {}, el("thead", {}, el("tr", {}, head.map(([t, num]) => el("th", { class: num ? "num" : null, text: t })))),
    el("tbody", {}, rows.map((r) => el("tr", {}, r.map((c, i) => el("td", { class: head[i][1] ? "num" : null }, c)))))));
  put("dispatch-table", dispatches.length ? table([["记录"], ["工单"], ["类别"], ["开始"], ["分钟", 1], ["退出码", 1], ["输入", 1], ["输出", 1]],
    dispatches.map((d) => { const u = val(d.usage); return [d.record || "", d.ticket ? issue(d.ticket) : "", val(d.category) ?? "未知", fmtTime(val(d.start)), fmtNum(val(d.minutes), 1), String(val(d.exitCode) ?? "未知"), fmtTok(u && u.inputTokens), fmtTok(u && u.outputTokens)]; }))
    : el("p", { class: "empty", text: "无" }));
  const runs = (ver && ver.runs) || [];
  put("verify-table", runs.length ? table([["层"], ["对象"], ["调用方"], ["开始"], ["排队", 1], ["运行", 1], ["退出码", 1]],
    runs.map((r) => [r.layer === "full" ? "完整" : "静态", r.target.kind === "main" ? "主工作区" : `${r.target.kind === "pr" ? "PR" : "工单"} #${r.target.number}`, r.caller, fmtTime(r.start), fmtNum(r.queuedMinutes, 1), fmtNum(r.minutes, 1), String(r.exitCode)]))
    : el("p", { class: "empty", text: "无" }));

  const risks = R.risks || [];
  const LEVEL = { critical: "高", serious: "中", warning: "低", good: "已处理" };
  put("risks", risks.length ? risks.map((r) => el("div", { class: "card" },
    el("h3", {}, status(r.level || "warning", LEVEL[r.level] || ""), " ", r.what),
    r.impact ? el("div", { text: `影响：${r.impact}` }) : null,
    r.next ? el("div", { class: "muted", text: `去向：${r.next}` }) : null))
    : el("p", { class: "empty", text: "无" }));

  put("findings", el("h3", { text: "流程发现" }), (R.findings || []).length ? el("ul", { class: "plain" }, R.findings.map((f) => el("li", { text: f }))) : el("p", { class: "empty", text: "无" }));
  const notes = [...(R.notes || []).map((n) => [n.item, n.note]), ...((S && S.missing) || []).map((m) => [`评分表缺数：${m.field}`, m.reason])];
  put("notes", el("h3", { text: "数据口径与缺项" }), notes.length ? table([["项"], ["说明"]], notes) : el("p", { class: "empty", text: "无" }));
  $("footer").textContent = S ? `过程数据来自评分表（tickets.ts scorecard ${R.spec}），截点 ${fmtTime(S.cutoffAt)}，采集 ${fmtTime(S.collectedAt)}。目标、证据、决定和风险由设计负责人填写。` : "没有评分表数据。";
}
</script>
</body>
