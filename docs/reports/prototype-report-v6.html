<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V6 Spec 交互式驾驶舱汇报原型</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f3f3ee;
  --bg-accent: radial-gradient(1100px 420px at 18% -6%, rgba(37, 99, 235, 0.08), transparent 65%),
               radial-gradient(900px 360px at 88% -4%, rgba(13, 148, 136, 0.07), transparent 60%);
  --surface: #ffffff;
  --surface2: #f9f9f6;
  --surface-glass: rgba(255, 255, 255, 0.88);
  --ink: #141518;
  --ink2: #3b3e47;
  --muted: #686d78;
  --border: #e2e2dc;
  --border-strong: #cfcfc6;
  --grid: #ecece6;
  --wash: #efefe9;
  --wash2: #e4e4dc;
  --axis: #9ca3af;
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 14px rgba(15, 23, 42, 0.035);
  --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.08), 0 2px 6px rgba(15, 23, 42, 0.04);

  --good: #15803d;
  --good-bg: #ecfdf3;
  --good-bd: rgba(21, 128, 61, 0.25);
  --warning: #b45309;
  --warning-bg: #fffbeb;
  --serious: #c2410c;
  --serious-bg: #fff4ed;
  --critical: #b91c1c;
  --critical-bg: #fef2f2;

  --agy: #2563eb;
  --agy-soft: rgba(37, 99, 235, 0.14);
  --pi: #0d9488;
  --pi-soft: rgba(13, 148, 136, 0.14);
  --claude: #ea580c;
  --claude-soft: rgba(234, 88, 12, 0.14);
  --codex: #4f46e5;
  --codex-soft: rgba(79, 70, 229, 0.14);

  --design: #d97706;
  --verify: #7c3aed;
  --wait: #db2777;
  --pause: #94a3b8;
  --out: #16a34a;
  --info-bg: #eff6ff;
  --info-bd: #bfdbfe;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f13;
    --bg-accent: radial-gradient(1100px 420px at 18% -6%, rgba(59, 130, 246, 0.14), transparent 65%),
                 radial-gradient(900px 360px at 88% -4%, rgba(45, 212, 191, 0.10), transparent 60%);
    --surface: #161920;
    --surface2: #1c2029;
    --surface-glass: rgba(22, 25, 32, 0.90);
    --ink: #f3f4f6;
    --ink2: #d1d5db;
    --muted: #9ca3af;
    --border: #282d39;
    --border-strong: #373e4f;
    --grid: #222631;
    --wash: #202530;
    --wash2: #2b3140;
    --axis: #6b7280;
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.28);
    --shadow-md: 0 14px 36px rgba(0, 0, 0, 0.48);

    --good: #4ade80;
    --good-bg: rgba(20, 83, 45, 0.35);
    --good-bd: rgba(74, 222, 128, 0.28);
    --warning: #fbbf24;
    --warning-bg: rgba(120, 53, 15, 0.30);
    --serious: #fb923c;
    --serious-bg: rgba(124, 45, 18, 0.32);
    --critical: #f87171;
    --critical-bg: rgba(127, 29, 29, 0.32);

    --agy: #60a5fa;
    --agy-soft: rgba(96, 165, 250, 0.18);
    --pi: #2dd4bf;
    --pi-soft: rgba(45, 212, 191, 0.18);
    --claude: #fb923c;
    --claude-soft: rgba(251, 146, 60, 0.18);
    --codex: #818cf8;
    --codex-soft: rgba(129, 140, 248, 0.18);

    --design: #f59e0b;
    --verify: #a78bfa;
    --wait: #f472b6;
    --pause: #64748b;
    --out: #4ade80;
    --info-bg: rgba(30, 58, 138, 0.28);
    --info-bd: rgba(96, 165, 250, 0.32);
  }
}

html[data-theme="dark"] {
  --bg: #0d0f13;
  --bg-accent: radial-gradient(1100px 420px at 18% -6%, rgba(59, 130, 246, 0.14), transparent 65%),
               radial-gradient(900px 360px at 88% -4%, rgba(45, 212, 191, 0.10), transparent 60%);
  --surface: #161920;
  --surface2: #1c2029;
  --surface-glass: rgba(22, 25, 32, 0.90);
  --ink: #f3f4f6;
  --ink2: #d1d5db;
  --muted: #9ca3af;
  --border: #282d39;
  --border-strong: #373e4f;
  --grid: #222631;
  --wash: #202530;
  --wash2: #2b3140;
  --axis: #6b7280;
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.28);
  --shadow-md: 0 14px 36px rgba(0, 0, 0, 0.48);

  --good: #4ade80;
  --good-bg: rgba(20, 83, 45, 0.35);
  --good-bd: rgba(74, 222, 128, 0.28);
  --warning: #fbbf24;
  --warning-bg: rgba(120, 53, 15, 0.30);
  --serious: #fb923c;
  --serious-bg: rgba(124, 45, 18, 0.32);
  --critical: #f87171;
  --critical-bg: rgba(127, 29, 29, 0.32);

  --agy: #60a5fa;
  --agy-soft: rgba(96, 165, 250, 0.18);
  --pi: #2dd4bf;
  --pi-soft: rgba(45, 212, 191, 0.18);
  --claude: #fb923c;
  --claude-soft: rgba(251, 146, 60, 0.18);
  --codex: #818cf8;
  --codex-soft: rgba(129, 140, 248, 0.18);

  --design: #f59e0b;
  --verify: #a78bfa;
  --wait: #f472b6;
  --pause: #64748b;
  --out: #4ade80;
  --info-bg: rgba(30, 58, 138, 0.28);
  --info-bd: rgba(96, 165, 250, 0.32);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background-color: var(--bg); color: var(--ink); }
body {
  background-image: var(--bg-accent);
  background-attachment: fixed;
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
  padding-bottom: 84px;
  -webkit-font-smoothing: antialiased;
}
code, pre, .mono {
  font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
.num { font-variant-numeric: tabular-nums; }

.shell { max-width: 1380px; margin: 0 auto; padding: 18px 20px 28px; }

.cockpit-grid {
  display: grid;
  grid-template-columns: 274px minmax(0, 1fr);
  gap: 18px;
  align-items: start;
}
.cockpit-grid.collapsed { grid-template-columns: minmax(0, 1fr); }
.cockpit-grid > * { min-width: 0; }

.cockpit-side {
  position: sticky;
  top: 14px;
  background: var(--surface-glass);
  backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 15px;
  box-shadow: var(--shadow-sm);
  display: grid;
  gap: 14px;
}
.cockpit-side[hidden] { display: none !important; }

.side-top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.pr-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 999px; font-weight: 600; font-size: 12px;
  background: var(--good-bg); color: var(--good); border: 1px solid var(--good-bd);
}
.pr-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.icon-btn {
  border: 1px solid var(--border); background: var(--surface2); color: var(--ink2);
  border-radius: 8px; padding: 4px 9px; font-size: 12px; font-weight: 500;
  cursor: pointer; font-family: inherit; white-space: nowrap;
  transition: all .16s ease;
}
.icon-btn:hover { border-color: var(--agy); color: var(--ink); transform: translateY(-1px); }

.expand-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  margin-bottom: 12px; padding: 8px 12px; border-radius: 12px;
  background: var(--surface-glass); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
}

.side-nav-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 5px; }
.side-nav { display: grid; gap: 4px; }
.nav-btn {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  width: 100%; text-align: left; padding: 7px 10px; border-radius: 9px;
  border: 1px solid transparent; background: transparent; color: var(--ink2);
  font: 500 13px/1.35 inherit; cursor: pointer; transition: all .15s ease;
}
.nav-btn:hover { background: var(--wash); color: var(--ink); }
.nav-btn.active {
  background: var(--agy-soft); color: var(--agy); border-color: rgba(37, 99, 235, 0.25); font-weight: 600;
}
.nav-count {
  font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--wash); color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.nav-btn.active .nav-count { background: var(--agy); color: #fff; }

.roster-list { display: grid; gap: 6px; }
.roster-card {
  display: grid; gap: 3px; width: 100%; text-align: left;
  padding: 8px 10px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--surface2); color: var(--ink);
  cursor: pointer; font-family: inherit; transition: all .16s ease;
}
.roster-card:hover { border-color: var(--border-strong); transform: translateX(2px); }
.roster-card.active { border-color: var(--agy); background: var(--agy-soft); box-shadow: 0 0 0 1px var(--agy); }
.roster-row1 { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.actor-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.effort-pill {
  padding: 1px 6px; border-radius: 5px; font-size: 10.5px; font-weight: 700;
  background: var(--wash2); color: var(--ink2); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.model-line {
  font-size: 11px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  overflow-wrap: anywhere;
}

.hero-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 18px 22px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 14px;
}
.top-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
h1 {
  font-size: clamp(19px, 2.1vw, 24px); line-height: 1.3; margin: 7px 0 6px;
  font-weight: 750; letter-spacing: -0.015em;
}
.lead { font-size: 14.5px; color: var(--ink2); margin: 0 0 14px; max-width: 92ch; }

.ask-banner {
  margin: 0 0 14px; padding: 13px 16px; border-radius: 12px;
  background: var(--serious-bg); border: 1px solid rgba(194, 65, 12, 0.38);
  display: grid; gap: 8px;
}
.ask-banner[hidden] { display: none !important; }
.ask-head { font-weight: 700; font-size: 13.5px; color: var(--serious); display: flex; align-items: center; gap: 6px; }
.ask-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
.ask-box { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; font-size: 13px; }

.kpi-grid {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px;
}
.kpi-card {
  position: relative; overflow: hidden;
  border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
  background: var(--surface2);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.kpi-card:hover { transform: translateY(-2px); border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.kpi-val { font-size: 20px; font-weight: 760; line-height: 1.2; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kpi-lbl { font-size: 12.5px; font-weight: 600; color: var(--ink); margin-top: 3px; }
.kpi-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
.kpi-ring { width: 46px; height: 46px; flex: none; }

.deck {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 16px 20px 20px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 14px;
}
.deck-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--grid);
}
.deck-title { font-size: 15.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

.seg-tabs {
  display: inline-flex; flex-wrap: wrap; gap: 4px;
  padding: 4px; border-radius: 11px; background: var(--wash); border: 1px solid var(--border);
}
.seg-tab {
  padding: 6px 13px; border-radius: 8px; border: 0; background: transparent;
  color: var(--ink2); font: 600 12.5px/1.3 inherit; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; transition: all .16s ease;
  white-space: nowrap;
}
.seg-tab:hover { color: var(--ink); }
.seg-tab.active {
  background: var(--surface); color: var(--agy);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
}
.tab-badge {
  font-size: 11px; padding: 0 6px; border-radius: 999px; background: var(--wash2); color: var(--ink2);
}
.seg-tab.active .tab-badge { background: var(--agy-soft); color: var(--agy); }

.story-compare {
  display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.35fr); gap: 12px; margin-bottom: 14px;
}
.story-pane {
  border-radius: 11px; padding: 13px 15px; border: 1px solid var(--border); background: var(--surface2);
}
.story-pane.before { border-left: 3.5px solid var(--serious); }
.story-pane.after { border-left: 3.5px solid var(--good); }
.pane-kicker { font-size: 12px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.step-pills { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; }
.step-pills li {
  display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 13px; color: var(--ink2);
}
.step-num {
  width: 22px; height: 22px; border-radius: 50%; background: var(--good-bg); color: var(--good);
  font-weight: 700; font-size: 11.5px; display: grid; place-items: center; margin-top: 1px;
  border: 1px solid var(--good-bd);
}

.arch-card {
  border: 1px solid var(--border); border-radius: 11px; padding: 12px 14px;
  background: var(--surface2); margin-bottom: 14px;
}
.arch-node { cursor: pointer; transition: opacity .15s ease; }
.arch-node:hover rect { stroke-width: 2.4px; }

.module-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.module-card {
  border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; background: var(--surface2);
  transition: border-color .15s ease, transform .15s ease;
}
.module-card:hover { border-color: var(--agy); transform: translateY(-1px); }
.module-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.ticket-tag {
  font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 5px;
  background: var(--wash); color: var(--ink2); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

.goal-cards { display: grid; gap: 10px; margin-bottom: 16px; }
.goal-card {
  display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr); gap: 14px;
  padding: 13px 15px; border-radius: 11px; border: 1px solid var(--border); background: var(--surface2);
}
.delta-pill {
  display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 4px 10px; border-radius: 7px; background: var(--surface); border: 1px solid var(--border);
  font-size: 12.5px; margin: 6px 0; font-variant-numeric: tabular-nums;
}
pre.proof {
  margin: 4px 0 0; padding: 9px 11px; background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; font-size: 11.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
}

.browser-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.browser-frame {
  border: 1px solid var(--border-strong); border-radius: 12px; overflow: hidden;
  background: var(--surface); box-shadow: var(--shadow-sm);
  transition: transform .18s ease, box-shadow .18s ease;
}
.browser-frame:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.browser-bar {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  background: var(--wash); border-bottom: 1px solid var(--border);
}
.traffic { display: inline-flex; gap: 5px; }
.traffic i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.url-pill {
  flex: 1; min-width: 0; padding: 2px 9px; border-radius: 6px; background: var(--surface);
  font-size: 11px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid var(--border);
}
.browser-canvas {
  padding: 12px; background: var(--surface2); cursor: zoom-in; position: relative;
}
.browser-foot { padding: 10px 13px; border-top: 1px solid var(--border); font-size: 12.5px; }

.takeaway-strip {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px;
}
.takeaway-card {
  padding: 10px 12px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border);
  border-top: 3px solid var(--agy); font-size: 12.5px; color: var(--ink2); line-height: 1.5;
}
.takeaway-card:nth-child(2) { border-top-color: var(--pi); }
.takeaway-card:nth-child(3) { border-top-color: var(--design); }
.takeaway-card b { color: var(--ink); display: block; margin-bottom: 3px; font-size: 13px; }

.timeline-box {
  padding: 11px 13px; border-radius: 11px; border: 1px solid var(--border);
  background: var(--surface2); margin-bottom: 14px;
}
.tl-span { cursor: pointer; transition: filter .15s ease, opacity .15s ease; }
.tl-span:hover { filter: brightness(1.12); }

.chart-split {
  display: grid; grid-template-columns: minmax(340px, 1fr) minmax(0, 1.15fr); gap: 14px; align-items: stretch;
}
.chart-card {
  border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--surface2);
  display: flex; flex-direction: column; justify-content: space-between;
}
.chart-title { font-size: 13.5px; font-weight: 700; margin-bottom: 2px; color: var(--ink); }
.chart-sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }

.story-compare > *, .module-grid > *, .goal-card > *, .browser-grid > *, .chart-split > * { min-width: 0; }
.donut-wrap { display: grid; grid-template-columns: 152px minmax(0, 1fr); gap: 12px; align-items: center; margin: auto 0; }
.donut-slice { cursor: pointer; transition: stroke-width .16s ease, opacity .16s ease; }
.donut-slice:hover { stroke-width: 26px; }
.donut-legend { display: grid; gap: 6px; font-size: 12px; }
.legend-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 4px 7px; border-radius: 6px; cursor: pointer; transition: background .14s;
}
.legend-item:hover { background: var(--wash); }
.swatch { width: 9px; height: 9px; border-radius: 2.5px; display: inline-block; flex: none; }

.bar-chart-row { cursor: pointer; transition: opacity .15s ease; }
.bar-chart-row:hover rect.bar-bg { fill: var(--wash2); }
.bar-chart-row.dimmed { opacity: 0.25; }

.tw { overflow-x: auto; }
table.clean { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.clean th, table.clean td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
table.clean th { color: var(--muted); font-weight: 600; font-size: 11.5px; white-space: nowrap; }
table.clean tbody tr { transition: background .12s ease; }
table.clean tbody tr:hover { background: var(--wash); }
table.clean tr:last-child td { border-bottom: 0; }
.mini-bar { height: 9px; border-radius: 999px; background: var(--wash2); overflow: hidden; display: flex; min-width: 96px; }

.wf-list { display: grid; gap: 7px; }
.wf-row {
  display: grid;
  grid-template-columns: minmax(175px, 220px) minmax(140px, 0.9fr) minmax(200px, 1.25fr) minmax(110px, 140px);
  gap: 10px; align-items: center; padding: 8px 11px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--surface2); font-size: 12.5px;
  transition: border-color .14s ease, transform .14s ease;
}
.wf-row:hover { border-color: var(--agy); transform: translateX(2px); }
.wf-row.dimmed { opacity: 0.25; }
.wf-axis-track { position: relative; height: 14px; background: var(--wash); border-radius: 999px; overflow: hidden; }
.wf-bar { position: absolute; top: 2px; height: 10px; border-radius: 999px; min-width: 6px; }
.wf-bar.aborted { background: none !important; border: 1.6px dashed var(--critical); }

.batch-fold { border: 1px solid var(--agy); border-radius: 10px; background: var(--surface2); padding: 9px 12px; }
.batch-fold summary {
  cursor: pointer; font-weight: 600; font-size: 12.5px;
  display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
}

.risk-grid { display: grid; gap: 9px; }
.risk-card {
  padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface2);
  display: grid; gap: 4px;
}
.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600;
}
.badge.good { background: var(--good-bg); color: var(--good); }

  function renderTimelineSvg(scene) {
    const tl = scene.timeline;
    const W = 920, labelW = 226, rightPad = 14, plotW = W - labelW - rightPad, rowH = 26;
    const p = tl.pauseSpan;
    const topPad = p ? 26 : 10;
    const H = topPad + tl.lanes.length * rowH + 24;
    const gapPx = p ? 26 : 0;
    const activeMin = p ? tl.totalMin - (p[1] - p[0]) : tl.totalMin;

    const xOf = (m) => {
      if (!p) return labelW + (m / tl.totalMin) * plotW;
      const usable = plotW - gapPx;
      if (m <= p[0]) return labelW + (m / activeMin) * usable;
      if (m >= p[1]) return labelW + (p[0] / activeMin) * usable + gapPx + ((m - p[1]) / activeMin) * usable;
      return labelW + (p[0] / activeMin) * usable + ((m - p[0]) / (p[1] - p[0])) * gapPx;
    };
    const pauseBandX = p ? xOf(p[0]) : 0;

    return `<div class="timeline-box">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:12px" class="muted">
        <span><b style="color:var(--ink)">全局并发泳道时间线</b>（鼠标悬停色块查看该时间段具体动作）</span>
        <span>日历总跨度 ${fmtMin(tl.totalMin)}${p ? ` · 已自动折叠 ${fmtMin(p[1] - p[0])} 停工空档` : ""}</span>
      </div>
      <div data-slot="timeline">
        <svg class="viz" viewBox="0 0 ${W} ${H}" role="img" aria-label="分角色与框架并发时间线">
          ${p ? `
            <text x="${(pauseBandX + gapPx / 2).toFixed(1)}" y="13" text-anchor="middle" font-size="10">折叠 ${fmtMin(p[1] - p[0])} 停工</text>
            <rect x="${pauseBandX.toFixed(1)}" y="18" width="${gapPx}" height="${H - 38}" fill="var(--wash2)" rx="4"/>
            <line x1="${(pauseBandX + gapPx / 2).toFixed(1)}" y1="20" x2="${(pauseBandX + gapPx / 2).toFixed(1)}" y2="${H - 22}" stroke="var(--axis)" stroke-dasharray="3 3"/>
          ` : ""}
          ${tl.lanes.map((lane, i) => {
            const y = topPad + i * rowH;
            const dim = state.filterActor && lane.actorId && state.filterActor !== lane.actorId ? 0.22 : 1;
            return `<g opacity="${dim}">
              <text x="${labelW - 10}" y="${y + 16}" text-anchor="end">${esc(lane.label)}</text>
              <rect x="${labelW}" y="${y + 4}" width="${plotW}" height="16" rx="4" fill="var(--wash)"/>
              ${lane.spans.map((sp) => {
                const x1 = xOf(sp[0]);
                const x2 = Math.max(x1 + 4, xOf(sp[1]));
                const kind = sp[2];
                const desc = sp[3] || sp[2] || "";
                const tip = `${lane.label}｜第 ${fmtMin(sp[0])} → ${fmtMin(sp[1])}（历时 ${fmtMin(sp[1] - sp[0])}）：${desc}`;
                if (kind === "aborted") {
                  return `<rect class="tl-span" data-tip="${esc(tip)}" x="${x1.toFixed(1)}" y="${y + 4}" width="${(x2 - x1).toFixed(1)}" height="16" rx="3" fill="none" stroke="var(--critical)" stroke-width="1.6" stroke-dasharray="3 2"/>`;
                }
                const fill = kind === "wait" ? "var(--wait)" : lane.color;
                return `<rect class="tl-span" data-tip="${esc(tip)}" x="${x1.toFixed(1)}" y="${y + 4}" width="${(x2 - x1).toFixed(1)}" height="16" rx="3" fill="${fill}"/>`;
              }).join("")}
            </g>`;
          }).join("")}
          <line x1="${labelW}" y1="${H - 18}" x2="${W - rightPad}" y2="${H - 18}" stroke="var(--axis)"/>
          <text x="${labelW}" y="${H - 4}">开工 0m</text>
          <text x="${W - rightPad}" y="${H - 4}" text-anchor="end">收尾 ${fmtMin(tl.totalMin)}</text>
        </svg>
      </div>
    </div>`;
  }

  function renderDonutSvg(segments, centerTop, centerSub, unitFormatter) {
    const total = segments.reduce((s, x) => s + x.val, 0) || 1;
    const r = 62, cx = 88, cy = 88, circum = 2 * Math.PI * r;
    let offset = 0;
    const arcs = segments.map((seg) => {
      const len = (seg.val / total) * circum;
      const pct = Math.round((seg.val / total) * 100);
      const tip = `${seg.label}：${unitFormatter(seg.val)}（占 ${pct}%）— ${seg.desc}`;
      const arc = `<circle class="donut-slice" cx="${cx}" cy="${cy}" r="${r}" fill="none"
        stroke="${seg.color}" stroke-width="22"
        stroke-dasharray="${Math.max(1.5, len - 1.5).toFixed(2)} ${circum.toFixed(2)}"
        stroke-dashoffset="${(-offset).toFixed(2)}"
        transform="rotate(-90 ${cx} ${cy})"
        data-tip="${esc(tip)}" data-center-val="${esc(unitFormatter(seg.val))}" data-center-lbl="${esc(seg.label)} (${pct}%)"/>`;
      offset += len;
      return arc;
    }).join("");

    return `<div class="donut-wrap">
      <svg viewBox="0 0 176 176" width="152" height="152" role="img" aria-label="${esc(centerSub)}">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--wash)" stroke-width="22"/>
        ${arcs}
        <text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="16" font-weight="760" fill="var(--ink)" class="donut-center-v">${esc(centerTop)}</text>
        <text x="${cx}" y="${cy + 16}" text-anchor="middle" font-size="10.5" fill="var(--muted)" class="donut-center-k">${esc(centerSub)}</text>
      </svg>
      <div class="donut-legend">
        ${segments.map((seg) => {
          const pct = Math.round((seg.val / total) * 100);
          const tip = `${seg.label}：${unitFormatter(seg.val)}（${pct}%）— ${seg.desc}`;
          return `<div class="legend-item" data-tip="${esc(tip)}">
            <span style="display:inline-flex;align-items:center;gap:6px;min-width:0">
              <i class="swatch" style="background:${seg.color}"></i>
              <span style="line-height:1.3">${esc(seg.label)}</span>
            </span>
            <b class="num" style="white-space:nowrap">${unitFormatter(seg.val)} <span class="muted">(${pct}%)</span></b>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }

  function renderGroupedBarChartSvg(scene) {

          <rect class="bar-bg" x="2" y="${y - 4}" width="${W - 4}" height="${rowH - 4}" rx="7" fill="transparent"/>
          <text x="${L - 8}" y="${y + 13}" text-anchor="end" font-weight="600" fill="var(--ink)">${esc(a.role)}</text>
          <text x="${L - 8}" y="${y + 28}" text-anchor="end" font-size="10.5" fill="var(--muted)">${esc(fw.label)} · ${esc(a.effort)}</text>

          <rect x="${L}" y="${y + 3}" width="${PW}" height="12" rx="6" fill="var(--wash)"/>

      }).join("")}
    </svg>`;

    </div>
    <div class="chart-card">
      <div class="chart-title">🏅 四元组（角色 · 框架 · 模型 · 思考强度）全量投入产出对比表</div>
      <div class="chart-sub">同一行横看耗时、真实干活量、多轮缓存复用与工程一次通过质量</div>
      <div class="tw">
        <table class="clean">
          <thead>
            <tr>
              <th>角色 · 框架 · 模型 · 思考强度</th>
              <th>耗时与单均</th>
              <th>真实干活 Token（新读 + 写出）</th>
              <th>多轮历史缓存重读</th>
              <th>工程质量与读档耗时</th>
            </tr>
          </thead>
          <tbody>
            ${scene.actors.map((a) => {
              const fw = FW_COLOR[a.fw] || FW_COLOR.codex;
              const freshPct = (a.fresh / maxReal) * 100;
              const outPct = Math.max(3, (a.output / maxReal) * 100);
              const dim = state.filterActor && state.filterActor !== a.id ? 'style="opacity:.25"' : "";
              return `<tr ${dim}>
                <td>
                  <div style="font-weight:700"><span class="actor-dot" style="background:${fw.solid};display:inline-block;margin-right:5px"></span>${esc(a.role)} <span class="effort-pill">思考:${esc(a.effort)}</span></div>
                  <div class="model-line">${esc(fw.label)} · ${esc(a.model)} · ${esc(a.runs)}</div>
                </td>
                <td class="num"><b>${fmtMin(a.minutes)}</b><div class="muted">${esc(a.unitText)}</div></td>
                <td>
                  <div class="mini-bar">
                    <div style="width:${freshPct.toFixed(1)}%;background:${fw.solid}"></div>
                    <div style="width:${outPct.toFixed(1)}%;background:var(--out)"></div>
                  </div>
                  <div class="num" style="margin-top:3px">首次新读 <b>${fmtTok(a.fresh)}</b> · 思考写出 <b style="color:var(--good)">${fmtTok(a.output)}</b></div>
                  ${a.note ? `<div style="color:var(--warning);font-size:11px">⚠ ${esc(a.note)}</div>` : ""}
                </td>
                <td class="num"><b>${fmtTok(a.cached)}</b><div class="muted">${a.turns} 轮工具复用</div></td>
                <td><b>${esc(a.pass)}</b><div class="muted">${esc(a.readDoc)}</div></td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  function renderLensWaterfall(scene) {
    if (!scene.dispatches.length && !scene.batches.length) {
      return `<div class="muted" style="padding:12px;border-radius:9px;background:var(--wash)">本场为纯主会话设计定稿模式（0 次外部 CLI 派发，无缺项）。</div>`;
    }
    const tl = scene.timeline;
    const p = tl.pauseSpan;
    const activeMin = p ? tl.totalMin - (p[1] - p[0]) : tl.totalMin;
    const pctOf = (m) => {
      if (!p) return (m / tl.totalMin) * 100;
      const gapPct = 4, usable = 100 - gapPct;
      if (m <= p[0]) return (m / activeMin) * usable;
      if (m >= p[1]) return (p[0] / activeMin) * usable + gapPct + ((m - p[1]) / activeMin) * usable;
      return (p[0] / activeMin) * usable + ((m - p[0]) / (p[1] - p[0])) * gapPct;
    };

    return `<div class="wf-list">
      ${scene.batches.map((b) => {
        const fw = FW_COLOR[b.fw] || FW_COLOR.codex;
        return `<details class="batch-fold">
          <summary>
            <span>📦 <b>${esc(b.prefix)}</b>（同前缀 >10 批自动折叠：<b>${b.okCount}/${b.count}</b> 批成功）</span>
            <span class="num">${esc(fw.label)} · <code>${esc(b.model)}</code> (${esc(b.effort)}) ｜ 墙钟 ${fmtMin(b.wallMin)} · 中位 ${fmtMin(b.medianMin)} · 新读 ${fmtTok(b.fresh)}</span>
          </summary>
          <div class="muted" style="margin:6px 0;color:var(--ink2)">${esc(b.story)}</div>
          <div class="tw">
            <table class="clean">
              <thead><tr><th>批次</th><th>耗时</th><th>真实干活 Token</th><th>状态</th></tr></thead>
              <tbody>${b.samples.map((r) => `<tr><td><code>${esc(r[0])}</code></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join("")}</tbody>
            </table>
          </div>
        </details>`;
      }).join("")}
      ${scene.dispatches.map((d) => {
        const fw = FW_COLOR[d.fw] || FW_COLOR.codex;
        const left = pctOf(d.startMin);
        const width = Math.max(2.5, pctOf(d.startMin + (d.min || 12)) - left);
        const dim = state.filterActor && state.filterActor !== d.actorId ? "dimmed" : "";
        return `<div class="wf-row ${dim}">
          <div>
            <div style="font-weight:700">${esc(d.name)}</div>
            <div class="model-line">${esc(fw.label)} · ${esc(d.model)} (${esc(d.effort)})</div>
          </div>
          <div>
            <div class="wf-axis-track"><div class="wf-bar ${d.ok ? "" : "aborted"}" style="left:${left.toFixed(1)}%;width:${width.toFixed(1)}%;background:${fw.solid}"></div></div>
            <div class="muted" style="font-size:11px;margin-top:2px">第 ${fmtMin(d.startMin)} 启动 · ${esc(d.kind)}</div>
          </div>
          <div style="color:var(--ink2)">${esc(d.story)}</div>
          <div class="num" style="text-align:right">
            <b>${fmtMin(d.min)}</b>
            <div class="muted">${d.fresh != null ? `新读 ${fmtTok(d.fresh)} · 写 ${fmtTok(d.out)}` : "断连无账单"}</div>
          </div>
        </div>`;
      }).join("")}
    </div>`;
  }

  function render() {
    const scene = SCENES[state.scene];
    const collapsed = state.sidebarCollapsed;
    const all = state.expandAll;

    document.querySelectorAll("[data-scene]").forEach((btn) => {
      btn.classList.toggle("on", btn.getAttribute("data-scene") === state.scene);
    });
    document.getElementById("expand-all-btn").classList.toggle("on", all);
    document.getElementById("expand-all-btn").textContent = all ? "返回页签切换视图" : "切换全展开长卷";

    const app = document.getElementById("app");
    app.innerHTML = `<div class="shell">
      ${collapsed ? `
        <div class="expand-bar">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <button type="button" class="icon-btn" id="toggle-side">» 展开左侧驾驶舱栏 (快捷键 [)</button>
            <span class="pr-pill"><i class="pr-dot"></i>PR #${scene.pr.number} · ${esc(scene.pr.state)}</span>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${scene.actors.map((a) => {
              const fw = FW_COLOR[a.fw] || FW_COLOR.codex;
              return `<button type="button" class="icon-btn" data-actor="${esc(a.id)}" style="${state.filterActor === a.id ? "border-color:var(--agy);color:var(--agy)" : ""}">
                <span class="actor-dot" style="background:${fw.solid};display:inline-block;margin-right:4px"></span>${esc(a.role)} · ${esc(fw.label)}
              </button>`;
            }).join("")}
          </div>
        </div>
      ` : ""}

      <div class="cockpit-grid ${collapsed ? "collapsed" : ""}">
        <aside class="cockpit-side" ${collapsed ? "hidden" : ""}>
          <div class="side-top">
            <span class="pr-pill"><i class="pr-dot"></i>PR #${scene.pr.number}</span>
            <button type="button" class="icon-btn" id="toggle-side" title="收起侧栏铺满全屏 (快捷键 [)">« 收起侧栏</button>
          </div>

          <div>
            <div style="font-weight:750;font-size:14px;line-height:1.38">${esc(scene.title)}</div>
            <div class="muted" style="margin-top:4px">${esc(scene.date)} · Spec ${esc(scene.spec)}</div>
          </div>

          <div>
            <div class="side-nav-label">快速切换视图（免滚动）</div>
            <div class="side-nav">
              <button type="button" class="nav-btn ${state.topTab === "overview" ? "active" : ""}" data-jump-top="overview">
                <span>✦ 改动机制与交付</span><span class="nav-count">${scene.delivered.length}</span>
              </button>
              <button type="button" class="nav-btn ${state.topTab === "goals" ? "active" : ""}" data-jump-top="goals">
                <span>🎯 目标与前端截图</span><span class="nav-count">${scene.goals.length + scene.shots.length}</span>
              </button>
              <button type="button" class="nav-btn ${state.topTab === "risks" ? "active" : ""}" data-jump-top="risks">
                <span>🛡 风险与上线边界</span><span class="nav-count">${scene.risks.length}</span>
              </button>
              <button type="button" class="nav-btn ${state.costLens === "charts" ? "active" : ""}" data-jump-lens="charts">
                <span>📊 耗时饼图 & 柱状图</span><span class="nav-count">图</span>
              </button>
              <button type="button" class="nav-btn ${state.costLens === "tokens" ? "active" : ""}" data-jump-lens="tokens">
                <span>🧮 Token 环图 & 对比表</span><span class="nav-count">${scene.actors.length}</span>
              </button>
              <button type="button" class="nav-btn ${state.costLens === "waterfall" ? "active" : ""}" data-jump-lens="waterfall">
                <span>⏱ 逐单协作与返工流</span><span class="nav-count">${scene.dispatches.length + scene.batches.length}</span>
              </button>
            </div>
          </div>

          <div>
            <div class="side-nav-label" style="display:flex;justify-content:space-between">
              <span>参演四元组（点击筛选）</span>
              ${state.filterActor ? `<a href="#" id="clear-actor" style="font-size:11px">重置</a>` : ""}
            </div>
            <div class="roster-list">
              ${scene.actors.map((a) => {
                const fw = FW_COLOR[a.fw] || FW_COLOR.codex;
                const active = state.filterActor === a.id ? "active" : "";
                return `<button type="button" class="roster-card ${active}" data-actor="${esc(a.id)}">
                  <div class="roster-row1">
                    <span style="font-weight:700;font-size:12.5px"><span class="actor-dot" style="background:${fw.solid};display:inline-block;margin-right:5px"></span>${esc(a.role)}</span>
                    <span class="effort-pill">${esc(fw.label)} · ${esc(a.effort)}</span>
                  </div>
                  <div class="model-line">${esc(a.model)}</div>
                </button>`;
              }).join("")}
            </div>
          </div>
        </aside>

        <div>
          <header class="hero-card">
            <div class="top-meta">
              <span>${esc(scene.date)}</span><span>·</span>
              <span>${esc(scene.repo)}</span><span>·</span>
              <span>Spec ${esc(scene.spec)}</span>
              <span class="pr-pill"><i class="pr-dot"></i>PR #${scene.pr.number} · ${esc(scene.pr.state)}</span>
            </div>
            <h1>${esc(scene.title)}</h1>
            <p class="lead">${esc(scene.lead)}</p>

            ${scene.asks.length ? `
              <div class="ask-banner">
                <div class="ask-head">⚡ 需要你拍板的决策（共 ${scene.asks.length} 项）</div>
                <div class="ask-grid">
                  ${scene.asks.map((a, idx) => `<div class="ask-box">
                    <div><b>${idx + 1}. 【${esc(a.kind)}】${esc(a.what)}</b></div>
                    <div class="muted" style="margin:3px 0">${esc(a.why)}</div>
                    <div style="color:var(--good);font-weight:600">建议：${esc(a.rec)}</div>
                  </div>`).join("")}
                </div>
              </div>
            ` : ""}

            <div class="kpi-grid">
              ${scene.kpis.map((k) => `<div class="kpi-card">
                <div>
                  <div class="kpi-val">${esc(k.v)}</div>
                  <div class="kpi-lbl">${esc(k.k)}</div>
                  <div class="kpi-sub">${esc(k.n)}</div>
                </div>
                ${renderKpiRing(k.pct, k.color)}
              </div>`).join("")}
            </div>
          </header>

          <section class="deck" id="deck-top">
            <div class="deck-head">
              <div class="deck-title"><span>1. 成果验收台</span><span class="muted">点右侧按钮直接切换「机制 / 实测与截图 / 风险」，免上下翻页</span></div>
              ${!all ? `
                <div class="seg-tabs" role="tablist">
                  <button type="button" class="seg-tab ${state.topTab === "overview" ? "active" : ""}" data-top="overview">
                    ✦ 改动机制与交付 <span class="tab-badge">${scene.delivered.length}</span>
                  </button>
                  <button type="button" class="seg-tab ${state.topTab === "goals" ? "active" : ""}" data-top="goals">
                    🎯 目标与前端截图 <span class="tab-badge">${scene.shots.length ? `${scene.shots.length}图` : scene.goals.length}</span>
                  </button>
                  <button type="button" class="seg-tab ${state.topTab === "risks" ? "active" : ""}" data-top="risks">
                    🛡 风险与边界 <span class="tab-badge">${scene.risks.length}</span>
                  </button>
                </div>
              ` : ""}
            </div>
            ${all
              ? renderDeliveryTab(scene) + `<div style="margin-top:16px">${renderGoalsAndGalleryTab(scene)}</div><div style="margin-top:16px">${renderRisksTab(scene)}</div>`
              : state.topTab === "goals" ? renderGoalsAndGalleryTab(scene)
              : state.topTab === "risks" ? renderRisksTab(scene)
              : renderDeliveryTab(scene)}
          </section>

          <section class="deck" id="deck-cost">
            <div class="deck-head">
              <div class="deck-title"><span>2. 耗时 · Token · 模型对比图表台</span><span class="muted">三透镜切换查看饼图、柱状图、四元组表与逐单复盘</span></div>
              ${!all ? `
                <div class="seg-tabs" role="tablist">
                  <button type="button" class="seg-tab ${state.costLens === "charts" ? "active" : ""}" data-lens="charts">
                    ① 耗时饼图 & 模型柱状图
                  </button>
                  <button type="button" class="seg-tab ${state.costLens === "tokens" ? "active" : ""}" data-lens="tokens">
                    ② Token 环形图 & 四元组表
                  </button>
                  <button type="button" class="seg-tab ${state.costLens === "waterfall" ? "active" : ""}" data-lens="waterfall">
                    ③ 逐单协作与返工流 <span class="tab-badge">${scene.dispatches.length + scene.batches.length}</span>
                  </button>
                </div>
              ` : ""}
            </div>

            <div class="takeaway-strip">
              ${scene.takeaways.map((t) => `<div class="takeaway-card"><b>${esc(t.title)}</b>${esc(t.body)}</div>`).join("")}
            </div>

            ${renderTimelineSvg(scene)}

            ${all
              ? renderLensCharts(scene) + `<div style="margin-top:14px">${renderLensTokenAndTable(scene)}</div><div style="margin-top:14px">${renderLensWaterfall(scene)}</div>`
              : state.costLens === "tokens" ? renderLensTokenAndTable(scene)
              : state.costLens === "waterfall" ? renderLensWaterfall(scene)
              : renderLensCharts(scene)}
          </section>
        </div>
      </div>
    </div>`;
  }

  const tipEl = document.getElementById("floating-tip");
  document.addEventListener("mouseover", (ev) => {
    const holder = ev.target.closest("[data-tip]");
    if (!holder) { tipEl.hidden = true; return; }
    tipEl.textContent = holder.getAttribute("data-tip");
    tipEl.hidden = false;

    if (holder.classList.contains("donut-slice")) {
      const svg = holder.closest("svg");
      const v = svg && svg.querySelector(".donut-center-v");
      const k = svg && svg.querySelector(".donut-center-k");
      if (v && holder.dataset.centerVal) v.textContent = holder.dataset.centerVal;
      if (k && holder.dataset.centerLbl) k.textContent = holder.dataset.centerLbl;
    }
  });
  document.addEventListener("mousemove", (ev) => {
    if (tipEl.hidden) return;
    const x = Math.min(window.innerWidth - 325, ev.clientX + 14);
    const y = Math.min(window.innerHeight - 90, ev.clientY + 14);
    tipEl.style.left = Math.max(8, x) + "px";
    tipEl.style.top = Math.max(8, y) + "px";
  });
  document.addEventListener("mouseout", (ev) => {
    const holder = ev.target.closest("[data-tip]");
    if (holder && !holder.contains(ev.relatedTarget)) tipEl.hidden = true;
  });

  document.addEventListener("click", (ev) => {
    if (ev.target.id === "clear-actor") {
      ev.preventDefault();
      state.filterActor = null;
      render();
      return;
    }
    const target = ev.target.closest("button, [data-shot], .bar-chart-row");
    if (!target) return;

    if (target.id === "toggle-side") {
      state.sidebarCollapsed = !state.sidebarCollapsed;
      render();
      return;
    }
    if (target.id === "expand-all-btn") {
      state.expandAll = !state.expandAll;
      render();
      return;
    }
    if (target.id === "theme-btn") {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark" ||
        (!document.documentElement.hasAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
      return;
    }
    if (target.hasAttribute("data-scene")) {
      state.scene = target.getAttribute("data-scene");
      state.filterActor = null;
      render();
      return;
    }
    if (target.hasAttribute("data-top")) {
      state.topTab = target.getAttribute("data-top");
      render();
      return;
    }
    if (target.hasAttribute("data-lens")) {
      state.costLens = target.getAttribute("data-lens");
      render();
      return;
    }
    if (target.hasAttribute("data-jump-top")) {
      state.expandAll = false;
      state.topTab = target.getAttribute("data-jump-top");
      render();
      document.getElementById("deck-top")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
      return;
    }
    if (target.hasAttribute("data-jump-lens")) {
      state.expandAll = false;
      state.costLens = target.getAttribute("data-jump-lens");
      render();
      document.getElementById("deck-cost")?.scrollIntoView({ behavior: "smooth", block: "nearest" });
      return;
    }
    if (target.hasAttribute("data-actor")) {
      const id = target.getAttribute("data-actor") || null;
      state.filterActor = state.filterActor === id ? null : id;
      render();
      return;
    }
    if (target.hasAttribute("data-shot")) {
      const scene = SCENES[state.scene];
      const shot = scene.shots[Number(target.getAttribute("data-shot"))];
      if (!shot) return;
      const lb = document.getElementById("lightbox");
      document.getElementById("lightbox-body").innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:12px;flex-wrap:wrap">
          <div><b>${esc(shot.title)}</b> <span class="muted">· ${esc(shot.url)}</span></div>
          <span class="muted">点击任意处或按 Esc 关闭</span>
        </div>
        <div class="muted" style="margin-bottom:12px;color:var(--ink2)">${esc(shot.focus)}</div>
        ${renderUiMock(shot.mockKind, true)}
      `;
      lb.hidden = false;
    }
  });

  document.getElementById("lightbox").addEventListener("click", () => {
    document.getElementById("lightbox").hidden = true;
  });

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape") { document.getElementById("lightbox").hidden = true; return; }
    if (ev.target && ev.target.matches("input, textarea, [contenteditable]")) return;
    if (ev.key === "[") { state.sidebarCollapsed = !state.sidebarCollapsed; render(); }
  });

  render();
})();
</script>
</body>
</html>
